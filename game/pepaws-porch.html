<title>Pepaws Porch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Pepaws Porch — a committed single visual world (one cottage, in real light).
   Muted, naturalistic palette; every surface painted explicitly so the page
   holds on either host ground. */
:root{
  --surround:#2B302C; --surround-2:#232823;
  --paper:#EFE9DD; --card:#F8F3E9; --card-2:#E7DFCF; --sunk:#DED5C2;
  --ink:#31302B; --ink-2:#6B6459; --ink-3:#918878;
  --line:#CDC3B0; --line-2:#B5A995;
  --sage:#6F7C5A; --sage-lo:#5A6649; --slate:#5B6C74; --plum:#7A6E86;
  --rust:#A8563E; --rust-lo:#8C4530; --ochre:#BE9350; --clay:#A8785F;
  --good:#5F7A50; --warn:#B08A3C; --bad:#A2523C;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--surround);
  background-image:radial-gradient(120% 90% at 50% 0%, #333A34 0%, var(--surround) 45%, var(--surround-2) 100%);
  color:var(--ink);
  font:400 16px/1.55 "Source Sans 3","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
}
h1,h2,h3{margin:0;font-family:Fraunces,Georgia,serif;font-weight:600;line-height:1.12;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--slate);outline-offset:2px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

#app{
  width:100%;max-width:468px;height:min(94vh,880px);min-height:560px;
  background:var(--card);border-radius:18px;overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.42);
  display:flex;flex-direction:column;position:relative;
}
#app.wide{max-width:1060px}

.topbar{flex:none;background:var(--card-2);border-bottom:1px solid var(--line);padding:10px 14px 11px;display:flex;flex-direction:column;gap:9px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.daylabel{font:600 12px/1 "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.clock{font:500 12px/1 "IBM Plex Mono",monospace;color:var(--ink-3)}
.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.m{display:flex;flex-direction:column;gap:4px}
.m span{font:600 9px/1 "IBM Plex Mono",monospace;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.m .track{height:5px;border-radius:3px;background:var(--sunk);overflow:hidden}
.m .track i{display:block;height:100%;border-radius:3px;transition:width .5s cubic-bezier(.4,0,.2,1)}

.stage{flex:none;position:relative;background:#B9C6CC;line-height:0}
.stage svg{display:block;width:100%;height:auto}
.stagenote{position:absolute;left:12px;top:12px;font:500 10px/1 "IBM Plex Mono",monospace;letter-spacing:.09em;text-transform:uppercase;color:#F3EEE2;background:rgba(31,34,30,.5);padding:5px 8px;border-radius:5px}

.panel{flex:1;min-height:0;overflow-y:auto;padding:16px 16px 20px;display:flex;flex-direction:column;gap:13px;background:var(--card)}
.panel::-webkit-scrollbar{width:8px}
.panel::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.who{font:700 11px/1 "IBM Plex Mono",monospace;letter-spacing:.13em;text-transform:uppercase;color:var(--rust)}
.who.narr{color:var(--ink-3)}
.line{font-size:17px;line-height:1.5;color:var(--ink)}
.line em{font-style:italic;color:var(--ink-2)}
.prompt{font-family:Fraunces,Georgia,serif;font-size:19px;font-weight:600;line-height:1.25}
.sub{font-size:13.5px;line-height:1.5;color:var(--ink-2)}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--card);border:1px solid var(--line-2);border-radius:10px;padding:12px 14px;font-size:15.5px;line-height:1.4;transition:background .14s,border-color .14s}
.opt:hover{background:#FDFAF3;border-color:var(--slate)}
.opt.examine{border-style:dashed;color:var(--ink-2);font-size:14.5px}
.opt[disabled]{opacity:.45;cursor:default}

.cont{align-self:flex-start;background:var(--slate);color:#F6F2E8;border:0;border-radius:9px;padding:11px 20px;font-weight:600;font-size:15px}
.cont:hover{background:#4E5D64}
.cont.primary{background:var(--sage)}
.cont.primary:hover{background:var(--sage-lo)}
.cont[disabled]{background:var(--line-2);cursor:default}

textarea{width:100%;min-height:132px;resize:vertical;padding:12px 13px;border-radius:10px;border:1px solid var(--line-2);background:#FDFAF3;color:var(--ink);font:400 15.5px/1.5 "Source Sans 3",system-ui,sans-serif}
textarea:focus{border-color:var(--slate);outline:none;box-shadow:0 0 0 3px rgba(91,108,116,.16)}
.tfoot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.count{font:500 11.5px/1 "IBM Plex Mono",monospace;color:var(--ink-3)}
.count.short{color:var(--rust)}

.timer{flex:none;height:4px;background:var(--sunk);position:relative;overflow:hidden}
.timer i{display:block;height:100%;background:var(--rust);width:100%}
.timerlabel{font:600 11px/1 "IBM Plex Mono",monospace;letter-spacing:.08em;color:var(--rust);text-transform:uppercase}

.notice{border-left:3px solid var(--ochre);background:#F2EADA;padding:11px 13px;border-radius:0 8px 8px 0;font-size:14px;line-height:1.5;color:var(--ink-2)}
.notice.alarm{border-left-color:var(--rust);background:#F4E3DC}
.notice b{color:var(--ink)}
.daycard{position:absolute;inset:0;z-index:20;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;animation:fade .3s ease}
.daycard .n{font:600 12px/1 "IBM Plex Mono",monospace;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-3)}
.daycard h2{font-size:31px}
.daycard .t{font-size:14.5px;color:var(--ink-2)}
@keyframes fade{from{opacity:0}to{opacity:1}}

.scroll{flex:1;min-height:0;overflow-y:auto}
.pad{padding:20px 18px 24px;display:flex;flex-direction:column;gap:14px}
.title h1{font-size:38px;letter-spacing:-.01em}
.title .kicker{font:600 11px/1 "IBM Plex Mono",monospace;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3)}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--ink-2)}
input[type=text],input[type=email]{padding:11px 12px;border:1px solid var(--line-2);border-radius:9px;background:#FDFAF3;font:400 15.5px/1.4 "Source Sans 3",system-ui,sans-serif;color:var(--ink)}
input:focus{border-color:var(--slate);outline:none;box-shadow:0 0 0 3px rgba(91,108,116,.16)}
.check{flex-direction:row;align-items:flex-start;gap:9px;font-weight:400;font-size:13.5px;line-height:1.45;color:var(--ink-2);cursor:pointer}
.check input{margin-top:3px;width:17px;height:17px;accent-color:var(--sage);flex:none}
.err{font-size:13px;color:var(--rust);font-weight:600}

.band{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:8px 15px;font-weight:700;font-size:14px;color:#F6F2E8}
.rows{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.row .v{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink-2);text-align:right;flex:none}
.status{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:7px}
.dotled{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ink-3)}
.dotled.ok{background:var(--good)} .dotled.no{background:var(--bad)} .dotled.wait{background:var(--warn)}

.atable{width:100%;border-collapse:collapse;font-size:13.5px}
.atable th{text-align:left;font:600 10px/1.3 "IBM Plex Mono",monospace;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);padding:8px 10px;border-bottom:1px solid var(--line-2);background:var(--card-2)}
.atable td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.awrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card);max-height:52vh}
.arow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pill{font:600 10.5px/1 "IBM Plex Mono",monospace;letter-spacing:.06em;padding:5px 9px;border-radius:999px;background:var(--sunk);color:var(--ink-2)}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
<div id="app" role="application" aria-label="Pepaws Porch assessment"></div>
<script>
"use strict";
/* ============================================================
   PEPAWS PORCH — homeshare readiness assessment
   One resident (Bruce Whitlam, 82), fourteen days, five graded
   challenges. Single-run assessment, not a replayable game.
   ============================================================ */

/* ---------- light presets: one cottage, different hours ---------- */
var LIGHT = {
  day:   {s1:"#A7BDCB", s2:"#DCE1D8", amb:"rgba(255,244,214,0.00)", warm:"#F2E4C4", key:0.00},
  gold:  {s1:"#BCC0B4", s2:"#EEDCB6", amb:"rgba(214,158,78,0.15)",  warm:"#FBEBC6", key:0.10},
  grey:  {s1:"#9FA9A9", s2:"#C9CBC2", amb:"rgba(96,104,112,0.13)",  warm:"#DCDCD2", key:0.04},
  dusk:  {s1:"#5E6E82", s2:"#C39E85", amb:"rgba(58,64,94,0.30)",    warm:"#E7C48F", key:0.22},
  night: {s1:"#2C3542", s2:"#495062", amb:"rgba(20,26,42,0.33)",    warm:"#F0D08A", key:0.40}
};

function defsFor(L){
  return '<defs>'
    + '<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+L.s1+'"/><stop offset="1" stop-color="'+L.s2+'"/></linearGradient>'
    + '<linearGradient id="roofg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6C7772"/><stop offset="1" stop-color="#525C58"/></linearGradient>'
    + '<linearGradient id="wallg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E4DBCA"/><stop offset="1" stop-color="#D2C7B2"/></linearGradient>'
    + '<linearGradient id="deckg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C4AC8B"/><stop offset="1" stop-color="#A88F70"/></linearGradient>'
    + '<linearGradient id="grassg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8B9670"/><stop offset="1" stop-color="#727D5B"/></linearGradient>'
    + '<linearGradient id="floorg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B49874"/><stop offset="1" stop-color="#8E7454"/></linearGradient>'
    + '<linearGradient id="innerwall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DCD5C4"/><stop offset="1" stop-color="#C4BBA6"/></linearGradient>'
    + '<linearGradient id="glassg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+L.warm+'" stop-opacity="0.85"/><stop offset="1" stop-color="#A9B6B4" stop-opacity="0.7"/></linearGradient>'
    + '<radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="'+L.warm+'" stop-opacity="0.72"/><stop offset="1" stop-color="'+L.warm+'" stop-opacity="0"/></radialGradient>'
    + '</defs>';
}
function ambient(L){
  return L.amb === "rgba(255,244,214,0.00)" ? "" : '<rect x="0" y="0" width="800" height="400" fill="'+L.amb+'"/>';
}

/* ---------- foliage: many small strokes, not one blob ---------- */
function bush(cx, cy, w, h, hue, seed){
  var out = '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + (w * 0.8).toFixed(1) + '" ry="' + (h * 0.74).toFixed(1) + '" fill="' + hue[1] + '"/>';
  var i, a, r, x, y, rr;
  var n = 26;
  for (i = 0; i < n; i++){
    a = (i * 2.399 + seed) % 6.283;
    r = 0.35 + ((i * 37 + seed * 11) % 100) / 155;
    x = cx + Math.cos(a) * w * r;
    y = cy + Math.sin(a) * h * r * 0.85;
    rr = 5 + ((i * 13 + seed * 7) % 9);
    out += '<ellipse cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" rx="'+rr+'" ry="'+(rr*0.82).toFixed(1)+'" fill="'+(i % 3 === 0 ? hue[1] : (i % 3 === 1 ? hue[0] : hue[2]))+'"/>';
  }
  return '<g>'+out+'</g>';
}
var GREENS = ["#7E8C67", "#66754F", "#93A07C"];
var GREENS_D = ["#5D6A4C", "#4B573C", "#6E7B5B"];

/* ---------- Bruce: ~6.5 heads tall, tonal shading, no outline ---------- */
var SKIN = "#D6AF8E", SKIN_D = "#BE9573", HAIR = "#BCB6A8", CARD = "#7D845F", CARD_D = "#666C4C",
    TROU = "#6C6B63", TROU_D = "#5B5A53", SHOE = "#4B423A", SHIRT = "#DFD8C7";

function head(cx, cy, tilt){
  return '<g transform="translate('+cx+','+cy+') rotate('+(tilt||0)+')">'
    + '<ellipse cx="0" cy="0" rx="13" ry="15" fill="'+SKIN+'"/>'
    + '<path d="M -13 2 C -13 12 -7 15 0 15 C 7 15 13 12 13 2 C 11 9 -11 9 -13 2 Z" fill="'+SKIN_D+'" opacity="0.35"/>'
    + '<ellipse cx="-13" cy="1" rx="3.4" ry="4.6" fill="'+SKIN_D+'"/>'
    + '<path d="M -13.5 -3 C -14 -19 14 -19 13.5 -3 C 11 -11 -11 -11 -13.5 -3 Z" fill="'+HAIR+'"/>'
    + '<path d="M -13.6 -3 C -14.4 2 -13.6 6 -12.6 8 C -13.4 2 -13.2 -1 -12.4 -4 Z" fill="'+HAIR+'"/>'
    + '<path d="M 13.6 -3 C 14.4 2 13.6 6 12.6 8 C 13.4 2 13.2 -1 12.4 -4 Z" fill="'+HAIR+'"/>'
    + '<rect x="-11.5" y="-6" width="9" height="7.5" rx="3" fill="#C9D6D6" fill-opacity="0.42" stroke="#4C463D" stroke-width="1.2"/>'
    + '<rect x="2.5" y="-6" width="9" height="7.5" rx="3" fill="#C9D6D6" fill-opacity="0.42" stroke="#4C463D" stroke-width="1.2"/>'
    + '<path d="M -2.5 -3 L 2.5 -3" stroke="#4C463D" stroke-width="1.2" fill="none"/>'
    + '<path d="M -7.5 5.5 C -4 3.6 4 3.6 7.5 5.5 C 4 7.6 -4 7.6 -7.5 5.5 Z" fill="'+HAIR+'"/>'
    + '<path d="M -3.5 9.6 L 3.5 9.6" stroke="#9C7256" stroke-width="1.3" stroke-linecap="round" fill="none"/>'
    + '</g>';
}

function bruce(pose, x, y, s){
  var g = '<g transform="translate('+x+','+y+') scale('+s+')">';
  g += '<ellipse cx="0" cy="3" rx="31" ry="7" fill="#2E3328" opacity="0.16"/>';
  if (pose === "stand" || pose === "stand_stick"){
    g += '<path d="M -14 -80 L -16 -7 L -3 -7 L -2 -80 Z" fill="'+TROU+'"/>'
      +  '<path d="M 2 -80 L 3 -7 L 16 -7 L 14 -80 Z" fill="'+TROU_D+'"/>'
      +  '<ellipse cx="-10" cy="-4" rx="10.5" ry="5" fill="'+SHOE+'"/><ellipse cx="10" cy="-4" rx="10.5" ry="5" fill="'+SHOE+'"/>'
      +  '<path d="M -20 -124 Q -24 -116 -23 -98 L -21 -76 L 21 -76 L 23 -98 Q 24 -116 20 -124 Q 0 -132 -20 -124 Z" fill="'+CARD+'"/>'
      +  '<path d="M 4 -128 L 23 -98 L 21 -76 L 4 -76 Z" fill="'+CARD_D+'" opacity="0.55"/>'
      +  '<path d="M -7 -128 L 0 -108 L 7 -128 Z" fill="'+SHIRT+'"/>'
      +  '<path d="M -20 -122 C -31 -112 -32 -95 -30 -80 L -22 -79 C -24 -95 -23 -109 -14 -119 Z" fill="'+CARD+'"/>'
      +  '<path d="M 20 -122 C 31 -112 32 -95 30 -80 L 22 -79 C 24 -95 23 -109 14 -119 Z" fill="'+CARD_D+'"/>'
      +  '<circle cx="-26" cy="-75" r="5.4" fill="'+SKIN+'"/><circle cx="26" cy="-75" r="5.4" fill="'+SKIN+'"/>'
      +  '<rect x="-6" y="-137" width="12" height="14" rx="4" fill="'+SKIN_D+'"/>'
      +  head(0, -148, 0);
    if (pose === "stand_stick"){
      g += '<path d="M 30 -78 L 34 -2" stroke="#8A6E4E" stroke-width="4" stroke-linecap="round" fill="none"/>'
        +  '<path d="M 26 -80 L 34 -80" stroke="#8A6E4E" stroke-width="4.5" stroke-linecap="round" fill="none"/>';
    }
  } else if (pose === "sit"){
    g += '<path d="M -22 -66 L -24 -30 L 14 -30 L 12 -66 Z" fill="'+TROU+'"/>'
      +  '<path d="M -24 -34 L -26 -30 L -26 -6 L -14 -6 L -13 -32 Z" fill="'+TROU_D+'"/>'
      +  '<path d="M 2 -34 L 1 -6 L 13 -6 L 14 -32 Z" fill="'+TROU+'"/>'
      +  '<ellipse cx="-20" cy="-4" rx="10" ry="4.6" fill="'+SHOE+'"/><ellipse cx="7" cy="-4" rx="10" ry="4.6" fill="'+SHOE+'"/>'
      +  '<path d="M -19 -112 Q -23 -104 -22 -86 L -21 -64 L 20 -64 L 21 -86 Q 22 -104 18 -112 Q 0 -119 -19 -112 Z" fill="'+CARD+'"/>'
      +  '<path d="M 3 -116 L 21 -86 L 20 -64 L 3 -64 Z" fill="'+CARD_D+'" opacity="0.5"/>'
      +  '<path d="M -6 -116 L 0 -97 L 6 -116 Z" fill="'+SHIRT+'"/>'
      +  '<path d="M -19 -110 C -28 -100 -29 -84 -25 -70 L -18 -71 C -21 -85 -21 -98 -13 -107 Z" fill="'+CARD+'"/>'
      +  '<path d="M 19 -110 C 28 -100 28 -86 24 -72 L 17 -73 C 20 -86 20 -98 13 -107 Z" fill="'+CARD_D+'"/>'
      +  '<circle cx="-22" cy="-66" r="5.2" fill="'+SKIN+'"/><circle cx="21" cy="-68" r="5.2" fill="'+SKIN+'"/>'
      +  '<rect x="-6" y="-125" width="12" height="14" rx="4" fill="'+SKIN_D+'"/>'
      +  head(-1, -136, -6);
  } else { /* floor — on his side against the cupboards, propped on one elbow */
    g += '<path d="M -66 -12 L -20 -16 L -18 -3 L -66 -2 Z" fill="'+TROU+'"/>'
      +  '<path d="M -64 -20 L -26 -24 L -22 -13 L -66 -11 Z" fill="'+TROU_D+'"/>'
      +  '<ellipse cx="-70" cy="-6" rx="9" ry="5" fill="'+SHOE+'"/><ellipse cx="-70" cy="-15" rx="8.5" ry="4.6" fill="'+SHOE+'"/>'
      +  '<path d="M -26 -30 Q -8 -34 6 -30 L 10 -12 Q -8 -4 -24 -8 Z" fill="'+CARD+'"/>'
      +  '<path d="M -26 -30 Q -14 -33 -4 -32 L -2 -12 Q -14 -8 -24 -9 Z" fill="'+CARD_D+'" opacity="0.45"/>'
      +  '<path d="M 4 -30 C 16 -30 22 -22 20 -12 L 12 -12 C 14 -20 10 -24 2 -24 Z" fill="'+CARD+'"/>'
      +  '<circle cx="18" cy="-9" r="5.2" fill="'+SKIN+'"/>'
      +  '<rect x="2" y="-36" width="15" height="12" rx="5" fill="'+SKIN_D+'" transform="rotate(-22 9 -30)"/>'
      +  head(22, -41, -24);
  }
  return g + '</g>';
}

/* ---------- the student's hands/objects are implied, never drawn ---------- */

/* ---------- scenes ---------- */
function scenePorch(L, opts){
  opts = opts || {};
  var s = '<svg viewBox="0 0 800 400" role="img" aria-label="The front verandah of Bruce’s cottage">' + defsFor(L);
  s += '<rect width="800" height="400" fill="url(#sky)"/>';
  /* neighbouring rooflines */
  s += '<path d="M 0 214 L 74 176 L 148 214 Z" fill="#8C948F" opacity="0.55"/>'
    +  '<path d="M 660 210 L 730 172 L 800 210 Z" fill="#8C948F" opacity="0.55"/>';
  /* street trees */
  s += bush(96, 168, 62, 52, GREENS_D, 3) + bush(714, 158, 58, 50, GREENS_D, 8);
  /* jacaranda, dusty not purple-candy */
  s += '<path d="M 168 302 C 172 262 160 236 146 214" stroke="#7A6752" stroke-width="9" fill="none" stroke-linecap="round"/>'
    +  bush(152, 196, 56, 44, ["#9A93AE", "#847D9B", "#ABA4BC"], 5);
  /* ground */
  s += '<rect x="0" y="296" width="800" height="104" fill="url(#grassg)"/>'
    +  '<path d="M 0 296 C 180 290 620 292 800 296 L 800 306 C 600 300 200 302 0 308 Z" fill="#96A07C" opacity="0.5"/>';
  /* house body */
  s += '<rect x="196" y="150" width="470" height="150" fill="url(#wallg)"/>';
  for (var i = 0; i < 10; i++) s += '<line x1="196" y1="'+(160+i*15)+'" x2="666" y2="'+(160+i*15)+'" stroke="#B8AC96" stroke-width="1" opacity="0.55"/>';
  /* gable + fascia */
  s += '<path d="M 178 156 L 431 78 L 684 156 Z" fill="url(#roofg)"/>'
    +  '<path d="M 178 156 L 431 78 L 431 88 L 196 158 Z" fill="#7C8782" opacity="0.7"/>'
    +  '<rect x="176" y="152" width="510" height="9" rx="2" fill="#E8E1D2"/>';
  /* verandah roof, posts, deck */
  s += '<rect x="166" y="186" width="530" height="11" rx="2" fill="#5C6763"/>'
    +  '<rect x="166" y="197" width="530" height="7" fill="#4E5854" opacity="0.6"/>'

/* ---------- utilities ---------- */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
function clamp(n){ return Math.max(0, Math.min(100, Math.round(n))); }
function el(sel){ return app.querySelector(sel); }
function nowISO(){ return new Date().toISOString(); }
function secsSince(t){ return t ? Math.round((Date.now() - t) / 100) / 10 : 0; }
function meterColour(v){ return v >= 70 ? "var(--good)" : (v >= 50 ? "var(--warn)" : "var(--bad)"); }

function save(){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* private mode, blocked storage */ }
}
function loadSaved(){
  try {
    var raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    var v = JSON.parse(raw);
    return (v && v.pid && v.view) ? v : null;
  } catch (e) { return null; }
}
function clearSaved(){ try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

function makePid(){
  var t = Date.now().toString(36);
  var r = Math.random().toString(36).slice(2, 8);
  return "PP-" + t + "-" + r;
}

/* ---------- timer (single active) ---------- */
var timerHandle = null, tickHandle = null;
function clearTimer(){
  if (timerHandle) { clearTimeout(timerHandle); timerHandle = null; }
  if (tickHandle) { clearInterval(tickHandle); tickHandle = null; }
}

  clearTimer();
  var bar = el("#tbar"), label = el("#tlabel");
  var endAt = Date.now() + seconds * 1000;
  if (bar){
    bar.style.width = "100%";
    bar.style.transition = "width " + seconds + "s linear";
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ bar.style.width = "0%"; }); });
  }
  if (label){
    var tick = function(){
      var left = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
      label.textContent = left + "s";
    };
    tick();
    tickHandle = setInterval(tick, 250);
  }
  timerHandle = setTimeout(function(){ clearTimer(); onExpire(); }, seconds * 1000);
}

/* ---------- rubric matching ----------
   A watch pattern must not fire on a negation. "I would not lift him" and
   "I haven't moved him" are what a GOOD answer says, and a naive substring
   match reads them as the opposite. Before accepting a watch hit we look back
   at the words immediately before it, within the same clause. */
var NEG_BEFORE = /(?:\b(?:not|never|no|nor|avoid|avoided|avoiding|without|instead of|rather than|refuse|refused|dont|didnt|wont|cant|wouldnt|couldnt|shouldnt)\b|\w+n['\u2019]t\b)[^.!?;]{0,26}$/i;

function hitUnnegated(re, text){
  var g = new RegExp(re.source, re.flags.indexOf("g") === -1 ? re.flags + "g" : re.flags);
  var m;
  while ((m = g.exec(text)) !== null){
    if (!NEG_BEFORE.test(text.slice(Math.max(0, m.index - 30), m.index))) return true;
    if (g.lastIndex === m.index) g.lastIndex++;
  }
  return false;
}

function scoreText(rubricKey, answer){
  var r = RUBRIC[rubricKey];
  var matched = [], missed = [], watch = [];
  if (!r) return {matched: matched, missed: missed, watch: watch, competency: ""};
  r.signals.forEach(function(sig){
    (sig.re.test(answer) ? matched : missed).push(sig.id);
  });
  (r.watch || []).forEach(function(w){ if (hitUnnegated(w.re, answer)) watch.push(w.id); });
  return {matched: matched, missed: missed, watch: watch, competency: r.competency};
}
function signalLabel(rubricKey, id){
  var r = RUBRIC[rubricKey]; if (!r) return id;
  var all = r.signals.concat(r.watch || []);
  for (var i = 0; i < all.length; i++) if (all[i].id === id) return all[i].label;
  return id;
}

/* ---------- effects ---------- */
function applyFx(f){
  if (!f) return;
  S.meters.rapport = clamp(S.meters.rapport + (f.rapport || 0));
  S.meters.autonomy = clamp(S.meters.autonomy + (f.autonomy || 0));
  S.meters.safety = clamp(S.meters.safety + (f.safety || 0));
}

/* ---------- navigation ---------- */
function enterStep(){
  S.phase = "step";
  S.stepEnteredAt = Date.now();
  save();
  render();
}
function nextStep(){
  clearTimer();
  var day = DAYS[S.di];
  if (S.si + 1 < day.steps.length){ S.si++; enterStep(); return; }
  if (S.di + 1 < DAYS.length){ S.di++; S.si = 0; S.view = "daycard"; save(); render(); return; }
  finish();
}

/* ============================================================
   VIEWS
   ============================================================ */
function render(){
  clearTimer();
  if (S.view === "title") return renderTitle();
  if (S.view === "daycard") return renderDayCard();
  if (S.view === "play") return renderPlay();
  if (S.view === "results") return renderResults();
  if (S.view === "assessor") return renderAssessor();
  renderTitle();
}

/* ---------- title / consent ---------- */
function renderTitle(){
  app.className = "";
  var saved = loadSaved();
  var resumable = saved && !saved.submittedAt && saved.view === "play";
  app.innerHTML =
    '<div class="stage">' + scenePorch(LIGHT.gold, {bruce: "stand_stick", bx: 470, bs: 0.84}) + '</div>'
    + '<div class="scroll"><div class="pad title">'
    + '<div><div class="kicker">Homeshare readiness assessment</div><h1>Pepaws Porch</h1></div>'
    + '<p class="sub">Fourteen days living with Bruce Whitlam, 82, at 14 Ellerslie Street. Five of those days put something in front of you that a placement will put in front of you for real. There are no right answers to memorise and no score to beat — an assessor reads what you write.</p>'
    + (resumable
        ? '<div class="notice"><b>You have a run in progress.</b> Day ' + esc(String(DAYS[saved.di].n)) + ' of 14.'
          + '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">'
          + '<button class="cont primary" id="resume">Resume day ' + esc(String(DAYS[saved.di].n)) + '</button>'
          + '<button class="cont" id="restart">Start again</button></div></div>'
        : '')
    + '<div style="display:flex;flex-direction:column;gap:12px">'
    + '<label>Your full name<input type="text" id="fname" autocomplete="name" maxlength="120" value="' + esc(S.name) + '"></label>'
    + '<label>Email<input type="email" id="femail" autocomplete="email" maxlength="160" value="' + esc(S.email) + '"></label>'
    + '</div>'
    + '<div class="notice"><b>Before you start.</b> Day 8 contains a scenario in which Bruce makes a discriminatory remark about neighbours. Any slur is censored on screen. It is part of the assessment and cannot be skipped — what is being assessed is your response, never the words. Days 11 and 14 are timed, and Day 14 is a medical emergency.</div>'
    + '<label class="check"><input type="checkbox" id="c1"><span>I understand this is an assessment. My answers, my choices and how long I took are recorded and read by a person at the placement service.</span></label>'
    + '<label class="check"><input type="checkbox" id="c2"><span>I have read the note about Day 8 and I am ready to continue.</span></label>'
    + '<div id="terr"></div>'
    + '<button class="cont primary" id="begin">Begin day 1</button>'
    + '<p class="sub" style="font-size:12.5px">About 12–15 minutes. Once you start, a scenario cannot be replayed.</p>'
    + '</div></div>';

  if (resumable){
    el("#resume").onclick = function(){ S = saved; S.view = "play"; enterStep(); };
    el("#restart").onclick = function(){ clearSaved(); S = freshState(); render(); };
  }
  el("#begin").onclick = function(){
    var name = el("#fname").value.trim(), email = el("#femail").value.trim();
    var errs = [];
    if (name.length < 2) errs.push("Enter your full name.");
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) errs.push("Enter a valid email address.");
    if (!el("#c1").checked || !el("#c2").checked) errs.push("Both boxes need ticking before you can start.");
    if (errs.length){ el("#terr").innerHTML = '<p class="err">' + esc(errs.join(" ")) + '</p>'; return; }
    S = freshState();
    S.name = name; S.email = email; S.pid = makePid();
    S.consentAt = nowISO(); S.startedAt = nowISO();
    S.view = "daycard"; S.di = 0; S.si = 0;
    save(); render();
  };
}

/* ---------- day card ---------- */
function renderDayCard(){
  app.className = "";
  var day = DAYS[S.di];
  app.innerHTML = topbarHTML(day)
    + '<div class="stage">' + sceneFor(day) + '</div>'
    + '<div class="panel"></div>'
    + '<div class="daycard"><div class="n">Day ' + day.n + ' of 14</div><h2>' + esc(day.title) + '</h2>'
    + '<div class="t">' + esc(day.time) + (day.kind === "level" ? " · assessed" : "") + '</div>'
    + '<button class="cont primary" id="go" style="margin-top:14px;align-self:center">Continue</button></div>';
  el("#go").onclick = function(){ S.view = "play"; enterStep(); };
}

/* ---------- play ---------- */
function sceneFor(day){
  var fn = SCENES[day.zone] || scenePorch;
  return fn(LIGHT[day.light] || LIGHT.day, day.scene || {});
}
function topbarHTML(day){
  var m = S.meters;
  var bar = function(k, label){
    return '<div class="m"><span>' + label + '</span><div class="track"><i style="width:' + m[k] + '%;background:' + meterColour(m[k]) + '"></i></div></div>';
  };
  return '<div class="topbar"><div class="toprow">'
    + '<span class="daylabel">Day ' + day.n + ' / 14 · ' + esc(day.title) + '</span>'
    + '<span class="clock">' + esc(day.time) + '</span></div>'
    + '<div class="meters">' + bar("rapport", "Rapport") + bar("autonomy", "Autonomy") + bar("safety", "Safety") + '</div></div>';
}

function renderPlay(){
  app.className = "";
  var day = DAYS[S.di];
  var step = day.steps[S.si];
  var timed = S.phase === "step" && step.t === "choice" && step.timer;
  app.innerHTML = topbarHTML(day)
    + '<div class="stage">' + sceneFor(day)
    + '<div class="stagenote">' + esc(day.zone === "porch" ? "Front verandah" : day.zone === "yard" ? "Back yard" : day.zone === "hall" ? "Hallway" : day.zone === "kitchen" ? "Kitchen" : "Lounge") + '</div></div>'
    + (timed ? '<div class="timer"><i id="tbar"></i></div>' : '')
    + '<div class="panel" id="panel"></div>';
  if (S.phase === "reply") renderReply(day);
  else if (step.t === "say") renderSay(day, step);
  else if (step.t === "choice") renderChoice(day, step);
  else if (step.t === "text") renderText(day, step);
}

function renderSay(day, step){
  var text = step.text;
  if (step.dyn === "boxes" && !S.flags.boxesCleared){
    text += " His walker is where it has been all fortnight — in the hall, behind your boxes.";
  }
  el("#panel").innerHTML =
    '<div class="who' + (step.narr ? " narr" : "") + '">' + esc(step.narr ? "14 Ellerslie Street" : step.who) + '</div>'
    + '<p class="line">' + (step.narr ? "" : "&ldquo;") + text + (step.narr ? "" : "&rdquo;") + '</p>'
    + '<button class="cont" id="next">Continue</button>';
  el("#next").onclick = nextStep;
}

function renderChoice(day, step){
  var key = S.di + "." + S.si;
  var doneEx = S.examined[key] || [];
  var p = el("#panel");
  var html = '<div class="prompt">' + esc(step.prompt) + '</div>';
  if (step.sub) html += '<p class="sub">' + esc(step.sub) + '</p>';
  if (step.timer) html += '<div class="timerlabel" id="tlabel">' + step.timer + 's</div>';
  if (doneEx.length){
    html += doneEx.map(function(i){
      return '<div class="notice">' + step.options[i].reply + '</div>';
    }).join("");
  }
  html += '<div class="opts">' + step.options.map(function(o, i){
    if (o.examine && doneEx.indexOf(i) !== -1) return "";
    return '<button class="opt' + (o.examine ? " examine" : "") + '" data-i="' + i + '">' + esc(o.text) + '</button>';
  }).join("") + '</div>';
  p.innerHTML = html;

  Array.prototype.forEach.call(p.querySelectorAll(".opt"), function(b){
    b.onclick = function(){ choose(day, step, parseInt(b.getAttribute("data-i"), 10), false); };
  });
  if (step.timer){
    runTimer(step.timer, function(){ choose(day, step, -1, true); });
  }
}

function choose(day, step, idx, timedOut){
  clearTimer();
  var key = S.di + "." + S.si;
  var seconds = secsSince(S.stepEnteredAt);

  if (!timedOut && step.options[idx].examine){
    var o = step.options[idx];
    if (o.flag) S.flags[o.flag] = true;
    S.examined[key] = (S.examined[key] || []).concat([idx]);
    S.choices.push({day: day.n, time: day.time, title: day.title, level: day.level || "",
      prompt: step.prompt, chosen: o.text, tag: "examine", dr: 0, da: 0, ds: 0,
      timedOut: false, seconds: seconds});
    save(); render();
    return;
  }

  var chosen = timedOut ? null : step.options[idx];
  var f = timedOut ? (step.timeoutFx || {}) : (chosen.fx || {});
  applyFx(f);
  if (!timedOut){
    if (chosen.flag) S.flags[chosen.flag] = true;
    if (chosen.tag) S.tags[chosen.tag] = true;
    if (chosen.hardStop) S.hardStop = true;
  } else if (step.hardStopOnTimeout){
    S.hardStop = true;
    S.tags.timeout_emergency = true;
  }
  S.choices.push({
    day: day.n, time: day.time, title: day.title, level: day.level || "",
    prompt: step.prompt,
    chosen: timedOut ? "(no response — timed out)" : chosen.text,
    tag: timedOut ? "timeout" : (chosen.tag || ""),
    dr: f.rapport || 0, da: f.autonomy || 0, ds: f.safety || 0,
    timedOut: !!timedOut, seconds: seconds
  });
  S.pending = {
    heading: timedOut ? "No response" : "You chose",
    choiceText: timedOut ? "The moment passed." : chosen.text,
    reply: timedOut ? (step.timeoutNote || "") : (chosen.reply || "")
  };
  S.phase = "reply";
  save(); render();
}

function renderReply(day){
  var p = S.pending || {};
  el("#panel").innerHTML =
    '<div class="who narr">' + esc(p.heading) + '</div>'
    + '<p class="line" style="font-size:15.5px;color:var(--ink-2)">' + esc(p.choiceText) + '</p>'
    + (p.reply ? '<p class="line">' + p.reply + '</p>' : "")
    + '<button class="cont" id="next">Continue</button>';
  el("#next").onclick = function(){ S.pending = null; nextStep(); };
}

function renderText(day, step){
  var p = el("#panel");
  p.innerHTML =
    '<div class="prompt">' + esc(step.prompt) + '</div>'
    + (step.sub ? '<p class="sub">' + esc(step.sub) + '</p>' : "")
    + '<textarea id="ta" maxlength="1500" placeholder="' + esc(step.placeholder || "") + '" aria-label="' + esc(step.prompt) + '"></textarea>'
    + '<div class="tfoot"><span class="count short" id="cnt">0 / ' + step.min + ' characters minimum</span>'
    + '<button class="cont primary" id="send" disabled>Send it</button></div>';
  var ta = el("#ta"), cnt = el("#cnt"), send = el("#send");
  var update = function(){
    var n = ta.value.trim().length;
    var ok = n >= step.min;
    cnt.textContent = ok ? (n + " / 1500 characters") : (n + " / " + step.min + " characters minimum");
    cnt.className = "count" + (ok ? "" : " short");
    send.disabled = !ok;
  };
  ta.addEventListener("input", update);
  update();
  setTimeout(function(){ try { ta.focus(); } catch (e) {} }, 30);
  send.onclick = function(){
    var answer = ta.value.trim();
    if (answer.length < step.min) return;
    var sc = scoreText(step.rubric, answer);
    S.responses.push({
      id: step.id, level: step.level, day: day.n, prompt: step.prompt,
      answer: answer, chars: answer.length, seconds: secsSince(S.stepEnteredAt),
      timedOut: false, matched: sc.matched, missed: sc.missed, watch: sc.watch,
      competency: sc.competency, rubric: step.rubric
    });
    save();
    nextStep();
  };
}
</script>
<script>
"use strict";
/* ---- xlsx-mini: dependency-free .xlsx writer (canonical copy: scripts/xlsx-mini.js) ---- */
/* xlsx-mini — minimal, dependency-free .xlsx writer.
   Builds an OOXML SpreadsheetML workbook inside a STORED (uncompressed) ZIP.
   sheets: [{name, rows: [[cell, ...], ...], widths?: [n, ...]}]
   Cells may be string | number | null | undefined | {v, bold}.
   Returns a Uint8Array. Works in browsers and in Node (needs TextEncoder). */
function xlsxMini(sheets) {
  var enc = new TextEncoder();

  var esc = function (s) {
    return String(s)
      .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, "") // control chars illegal in XML 1.0
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&apos;");
  };

  var colName = function (n) { // 0 -> A
    var s = "";
    for (n = n + 1; n > 0; n = Math.floor((n - 1) / 26)) s = String.fromCharCode(65 + ((n - 1) % 26)) + s;
    return s;
  };

  var safeName = function (n, i) {
    var cleaned = String(n || ("Sheet" + (i + 1))).replace(/[\\\/\?\*\[\]:]/g, " ").slice(0, 31).trim();
    return cleaned || ("Sheet" + (i + 1));
  };

  var sheetXml = function (sheet) {
    var cols = (sheet.widths && sheet.widths.length)
      ? "<cols>" + sheet.widths.map(function (w, i) {
          return '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>';
        }).join("") + "</cols>"
      : "";
    var rows = sheet.rows.map(function (row, r) {
      var cells = row.map(function (raw, c) {
        var cell = (raw && typeof raw === "object") ? raw : { v: raw };
        var v = cell.v;
        if (v === null || v === undefined || v === "") return "";
        var ref = colName(c) + (r + 1);
        var style = cell.bold ? ' s="1"' : "";
        if (typeof v === "number" && isFinite(v)) return '<c r="' + ref + '"' + style + "><v>" + v + "</v></c>";
        return '<c r="' + ref + '"' + style + ' t="inlineStr"><is><t xml:space="preserve">' + esc(v) + "</t></is></c>";
      }).join("");
      return '<row r="' + (r + 1) + '">' + cells + "</row>";
    }).join("");
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
      + '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>'
      + cols + "<sheetData>" + rows + "</sheetData></worksheet>";
  };

  var files = [];
  files.push(["[Content_Types].xml",
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
    + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
    + '<Default Extension="xml" ContentType="application/xml"/>'
    + '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
    + '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
    + sheets.map(function (_, i) {
        return '<Override PartName="/xl/worksheets/sheet' + (i + 1) + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';
      }).join("")
    + "</Types>"]);
  files.push(["_rels/.rels",
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'
    + "</Relationships>"]);
  files.push(["xl/workbook.xml",
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'
    + "<sheets>" + sheets.map(function (s, i) {
        return '<sheet name="' + esc(safeName(s.name, i)) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>';
      }).join("") + "</sheets>"
    + "</workbook>"]);
  files.push(["xl/_rels/workbook.xml.rels",
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    + sheets.map(function (_, i) {
        return '<Relationship Id="rId' + (i + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>';
      }).join("")
    + '<Relationship Id="rId' + (sheets.length + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'
    + "</Relationships>"]);
  files.push(["xl/styles.xml",
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
    + '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts>'
    + '<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>'
    + "<borders count=\"1\"><border><left/><right/><top/><bottom/><diagonal/></border></borders>"
    + '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'
    + '<cellXfs count="2">'
    + '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'
    + '<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>'
    + "</cellXfs>"
    + '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>'
    + "</styleSheet>"]);
  sheets.forEach(function (s, i) { files.push(["xl/worksheets/sheet" + (i + 1) + ".xml", sheetXml(s)]); });

  // --- CRC32 ---
  var table = xlsxMini._crcTable;
  if (!table) {
    table = xlsxMini._crcTable = new Uint32Array(256);
    for (var n = 0; n < 256; n++) {
      var c = n;
      for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      table[n] = c >>> 0;
    }
  }
  var crc32 = function (bytes) {
    var c = 0xFFFFFFFF;
    for (var i = 0; i < bytes.length; i++) c = table[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  };

  // --- ZIP (STORED, no compression) ---
  var parts = [], central = [], offset = 0;
  var u16 = function (n) { return [n & 0xFF, (n >>> 8) & 0xFF]; };
  var u32 = function (n) { return [n & 0xFF, (n >>> 8) & 0xFF, (n >>> 16) & 0xFF, (n >>> 24) & 0xFF]; };

  files.forEach(function (f) {
    var nameBytes = enc.encode(f[0]);
    var body = enc.encode(f[1]);
    var crc = crc32(body);
    var local = [].concat(
      u32(0x04034b50), u16(20), u16(0x0800), u16(0), u16(0), u16(0),
      u32(crc), u32(body.length), u32(body.length),
      u16(nameBytes.length), u16(0)
    );
    parts.push(new Uint8Array(local), nameBytes, body);
    central.push([[].concat(
      u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(0), u16(0), u16(0),
      u32(crc), u32(body.length), u32(body.length),
      u16(nameBytes.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(offset)
    ), nameBytes]);
    offset += local.length + nameBytes.length + body.length;
  });

  var centralParts = [], centralSize = 0;
  central.forEach(function (e) {
    centralParts.push(new Uint8Array(e[0]), e[1]);
    centralSize += e[0].length + e[1].length;
  });
  var eocd = new Uint8Array([].concat(
    u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length),
    u32(centralSize), u32(offset), u16(0)
  ));

  var all = parts.concat(centralParts, [eocd]);
  var total = all.reduce(function (n, p) { return n + p.length; }, 0);
  var out = new Uint8Array(total), pos = 0;
  all.forEach(function (p) { out.set(p, pos); pos += p.length; });
  return out;
}
</script>
<script>
"use strict";
/* ============================================================
   OUTCOME, RECORD, STORAGE, EXPORT
   ============================================================ */
var DECLINE_RE = /\b((would|could)\s*n[o']?t\s+(continue|stay|carry on|live)|not\s+(continue|stay in|take)\s+(the|this)\s+placement|end the placement|leave the (house|placement)|move out|withdraw from the placement|ask(ing)? for a different (placement|household))\b/i;

function computeOutcome(){
  var m = S.meters, reasons = [], band;
  var watchFlags = [];
  S.responses.forEach(function(r){ (r.watch || []).forEach(function(w){ if (watchFlags.indexOf(w) === -1) watchFlags.push(w); }); });
  var thin = S.responses.filter(function(r){ return r.answer.trim().length < 80; }).length;
  var declined = S.responses.some(function(r){ return DECLINE_RE.test(r.answer); });

  if (S.hardStop){
    band = "Assessor review";
    reasons.push("Day 14: an ambulance was not called in the first window. A first-aid module is required before any re-sit.");
  } else if (declined){
    band = "Assessor review";
    reasons.push("You said you would not continue this placement. That is a valid answer, and it is one a person reads rather than a rule.");
  } else if (S.tags.laughed){
    band = "Not yet";
    reasons.push("Day 8: agreeing with the remark. Silence and agreement both read the same way to the person it is about.");
  } else if (m.safety < 50 || m.autonomy < 45){
    band = "Not yet";
    if (m.safety < 50) reasons.push("Safety finished at " + m.safety + ". Hazards were left standing or an escalation was missed.");
    if (m.autonomy < 45) reasons.push("Autonomy finished at " + m.autonomy + ". Too much was taken out of Bruce's hands.");
  } else if (m.rapport < 45 || m.safety < 65 || m.autonomy < 65 || S.tags.rupture || S.tags.lifted || watchFlags.length || thin){
    band = "Certified with notes";
    if (m.rapport < 45) reasons.push("Rapport finished at " + m.rapport + " — the relationship took damage the placement would feel.");
    if (m.safety < 65) reasons.push("Safety finished at " + m.safety + ".");
    if (m.autonomy < 65) reasons.push("Autonomy finished at " + m.autonomy + ".");
    if (S.tags.rupture) reasons.push("Day 8: the boundary held, but it ended the conversation for a day.");
    if (S.tags.lifted) reasons.push("Day 11: you took his weight. Never lift — offer, and let him find his balance.");
    watchFlags.forEach(function(w){ reasons.push("Watch item in your writing: " + signalLabel(S.responses.filter(function(r){ return (r.watch || []).indexOf(w) !== -1; })[0].rubric, w) + "."); });
    if (thin) reasons.push(thin + " written answer" + (thin > 1 ? "s were" : " was") + " very short. An assessor may ask you to expand.");
  } else {
    band = "Certified";
    reasons.push("Clean run: the emergency was called, hazards were dealt with, and Bruce stayed in charge of his own house.");
  }
  return {band: band, reasons: reasons, hardStop: S.hardStop, declined: declined, watchFlags: watchFlags};
}

function bandColour(b){
  return b === "Certified" ? "var(--good)" : b === "Certified with notes" ? "var(--warn)"
    : b === "Not yet" ? "var(--plum)" : "var(--bad)";
}

function toRecord(){
  var o = computeOutcome();
  return {
    version: VERSION, pid: S.pid, name: S.name, email: S.email,
    consentAt: S.consentAt, startedAt: S.startedAt, submittedAt: S.submittedAt,
    durationMin: S.startedAt && S.submittedAt
      ? Math.round((new Date(S.submittedAt) - new Date(S.startedAt)) / 6000) / 10 : 0,
    rapport: S.meters.rapport, autonomy: S.meters.autonomy, safety: S.meters.safety,
    band: o.band, hardStop: !!o.hardStop, declined: !!o.declined,
    reasons: o.reasons, watchFlags: o.watchFlags,
    flags: S.flags, tags: S.tags,
    responses: S.responses, choices: S.choices,
    assessorStatus: "Awaiting assessor review"
  };
}

/* ---------- capability access (design for absence) ---------- */
function getCap(name){
  try {
    if (!window.claude || typeof window.claude.use !== "function") return Promise.resolve(null);
    return window.claude.use(name).then(function(v){ return v || null; }, function(){ return null; });
  } catch (e) { return Promise.resolve(null); }
}

function setStatus(id, cls, text){
  var n = document.getElementById(id);
  if (n) n.innerHTML = '<span class="dotled ' + cls + '"></span><span>' + esc(text) + '</span>';
}

function saveToBackend(rec){
  return getCap("db").then(function(db){
    if (!db){
      S.submitState = "local";
      setStatus("savestat", "wait", "Not written to the shared record from this view — download the file below and send it to the placement service.");
      return;
    }
    return db.doc("submissions/" + S.pid).set(rec).then(function(){
      S.submitState = "saved";
      setStatus("savestat", "ok", "Saved to the placement record as " + S.pid + ".");
      save();
    }, function(err){
      S.submitState = "error";
      S.submitDetail = (err && err.code) || "unavailable";
      var msg = S.submitDetail === "quota_exceeded"
        ? "The record store is full. Download the file below and send it to the placement service."
        : "Could not write to the placement record (" + S.submitDetail + "). Download the file below and send it to the placement service.";
      setStatus("savestat", "no", msg);
    });
  });
}

/* ---------- workbooks ---------- */
function rubricSheet(){
  var rows = [[{v:"Level",bold:true},{v:"Competency",bold:true},{v:"Kind",bold:true},{v:"Signal id",bold:true},{v:"What it looks like",bold:true}]];
  ["L1","L2","L3","L4","L5"].forEach(function(k){
    var r = RUBRIC[k];
    r.signals.forEach(function(s){ rows.push([k, r.competency, "signal", s.id, s.label]); });
    (r.watch || []).forEach(function(s){ rows.push([k, r.competency, "watch", s.id, s.label]); });
  });
  rows.push([]);
  rows.push([{v:"Bands",bold:true}]);
  rows.push(["Certified", "Clean run; emergency called, hazards handled, autonomy preserved"]);
  rows.push(["Certified with notes", "Placeable, with named coaching items for the coordinator"]);
  rows.push(["Not yet", "A gap: a named module, then a re-sit"]);
  rows.push(["Assessor review", "A person writes the outcome. Never auto-issued in either direction"]);
  return {name: "Rubric", widths: [8, 46, 10, 22, 52], rows: rows};
}

function freeTextRows(rec, withParticipant){
  var head = (withParticipant ? [{v:"Participant",bold:true},{v:"Name",bold:true}] : [])
    .concat([{v:"Level",bold:true},{v:"Day",bold:true},{v:"Competency",bold:true},{v:"Prompt",bold:true},
             {v:"Answer",bold:true},{v:"Characters",bold:true},{v:"Seconds",bold:true},
             {v:"Signals matched",bold:true},{v:"Signals missed",bold:true},{v:"Watch flags",bold:true}]);
  var rows = [head];
  (rec.responses || []).forEach(function(r){
    rows.push((withParticipant ? [rec.pid, rec.name] : []).concat([
      r.id, r.day, r.competency, r.prompt, r.answer, r.chars, r.seconds,
      (r.matched || []).join(", "), (r.missed || []).join(", "), (r.watch || []).join(", ")
    ]));
  });
  return rows;
}
function choiceRows(rec, withParticipant){
  var head = (withParticipant ? [{v:"Participant",bold:true}] : [])
    .concat([{v:"Day",bold:true},{v:"Time",bold:true},{v:"Scene",bold:true},{v:"Level",bold:true},
             {v:"Prompt",bold:true},{v:"Chose",bold:true},{v:"Tag",bold:true},
             {v:"Rapport",bold:true},{v:"Autonomy",bold:true},{v:"Safety",bold:true},
             {v:"Timed out",bold:true},{v:"Seconds",bold:true}]);
  var rows = [head];
  (rec.choices || []).forEach(function(c){
    rows.push((withParticipant ? [rec.pid] : []).concat([
      c.day, c.time, c.title, c.level, c.prompt, c.chosen, c.tag,
      c.dr, c.da, c.ds, c.timedOut ? "yes" : "", c.seconds
    ]));
  });
  return rows;
}

function participantWorkbook(rec){
  var summary = [
    [{v:"Pepaws Porch — homeshare readiness assessment",bold:true}],
    [],
    [{v:"Participant id",bold:true}, rec.pid],
    [{v:"Name",bold:true}, rec.name],
    [{v:"Email",bold:true}, rec.email],
    [{v:"Consented",bold:true}, rec.consentAt],
    [{v:"Started",bold:true}, rec.startedAt],
    [{v:"Submitted",bold:true}, rec.submittedAt],
    [{v:"Duration (min)",bold:true}, rec.durationMin],
    [],
    [{v:"Rapport",bold:true}, rec.rapport],
    [{v:"Autonomy",bold:true}, rec.autonomy],
    [{v:"Safety",bold:true}, rec.safety],
    [],
    [{v:"Provisional band",bold:true}, rec.band],
    [{v:"Status",bold:true}, rec.assessorStatus],
    [{v:"Emergency hard stop",bold:true}, rec.hardStop ? "yes" : "no"],
    [{v:"Declined placement",bold:true}, rec.declined ? "yes" : "no"],
    []
  ];
  summary.push([{v:"Notes",bold:true}]);
  (rec.reasons || []).forEach(function(r){ summary.push(["", r]); });
  return [
    {name: "Submission", widths: [24, 70], rows: summary},
    {name: "Free text", widths: [8, 6, 40, 46, 88, 12, 10, 34, 34, 26], rows: freeTextRows(rec, false)},
    {name: "Choices", widths: [6, 10, 24, 7, 46, 62, 16, 10, 10, 9, 10, 9], rows: choiceRows(rec, false)},
    rubricSheet()
  ];
}

function assessorWorkbook(records){
  var head = [[{v:"Participant",bold:true},{v:"Name",bold:true},{v:"Email",bold:true},
               {v:"Submitted",bold:true},{v:"Duration (min)",bold:true},
               {v:"Rapport",bold:true},{v:"Autonomy",bold:true},{v:"Safety",bold:true},
               {v:"Provisional band",bold:true},{v:"Hard stop",bold:true},{v:"Declined",bold:true},
               {v:"Watch flags",bold:true},{v:"Status",bold:true},{v:"Notes",bold:true}]];
  records.forEach(function(r){
    head.push([r.pid, r.name, r.email, r.submittedAt, r.durationMin, r.rapport, r.autonomy, r.safety,
      r.band, r.hardStop ? "yes" : "", r.declined ? "yes" : "", (r.watchFlags || []).join(", "),
      r.assessorStatus || "Awaiting assessor review", (r.reasons || []).join(" | ")]);
  });
  var ft = [], ch = [];
  records.forEach(function(r, i){
    var rows = freeTextRows(r, true); if (i === 0) ft = rows; else ft = ft.concat(rows.slice(1));
    var crows = choiceRows(r, true); if (i === 0) ch = crows; else ch = ch.concat(crows.slice(1));
  });
  if (!ft.length) ft = freeTextRows({responses: []}, true);
  if (!ch.length) ch = choiceRows({choices: []}, true);
  return [
    {name: "Submissions", widths: [22, 24, 30, 24, 13, 10, 11, 9, 22, 11, 11, 30, 26, 90], rows: head},
    {name: "Free text", widths: [22, 22, 8, 6, 40, 46, 88, 12, 10, 34, 34, 26], rows: ft},
    {name: "Choices", widths: [22, 6, 10, 24, 7, 46, 62, 16, 10, 10, 9, 10, 9], rows: ch},
    rubricSheet()
  ];
}

function offerFile(filename, sheets, statusId){
  var bytes;
  try { bytes = xlsxMini(sheets); }
  catch (e){ setStatus(statusId, "no", "Could not build the workbook."); return; }
  getCap("downloads").then(function(d){
    if (!d){ setStatus(statusId, "no", "Downloads are not available in this view."); return; }
    setStatus(statusId, "wait", "Waiting for you to confirm the download…");
    d.save({filename: filename, data: bytes}).then(function(){
      setStatus(statusId, "ok", "Saved " + filename + ".");
    }, function(err){
      var code = (err && err.code) || "unavailable";
      if (code === "declined") setStatus(statusId, "wait", "Download cancelled.");
      else if (code === "rate_limited") setStatus(statusId, "wait", "A download prompt is already open. Finish that one first.");
      else setStatus(statusId, "no", "Download failed (" + code + ").");
    });
  });
}

/* ============================================================
   RESULTS
   ============================================================ */
function finish(){
  clearTimer();
  S.submittedAt = nowISO();
  S.view = "results";
  save();
  render();
  saveToBackend(toRecord());
}

function renderResults(){
  app.className = "";
  var rec = toRecord();
  var lv = [{k:"L1",d:3,n:"Technology"},{k:"L2",d:6,n:"Low mood"},{k:"L3",d:8,n:"A remark"},{k:"L4",d:11,n:"Mobility"},{k:"L5",d:14,n:"Emergency"}];
  var perLevel = lv.map(function(x){
    var r = null;
    for (var i = 0; i < rec.responses.length; i++) if (rec.responses[i].id === x.k) r = rec.responses[i];
    if (!r) return "";
    var tot = r.matched.length + r.missed.length;
    return '<div class="row"><div><b>Day ' + x.d + ' — ' + esc(x.n) + '</b>'
      + '<div class="sub" style="font-size:12.5px">' + esc(r.competency) + '</div>'
      + (r.watch.length ? '<div class="sub" style="font-size:12.5px;color:var(--rust)">Watch: '
          + esc(r.watch.map(function(w){ return signalLabel(r.rubric, w); }).join("; ")) + '</div>' : "")
      + '</div><div class="v">' + r.matched.length + '/' + tot + ' signals<br>' + r.chars + ' chars</div></div>';
  }).join("");

  app.innerHTML =
    '<div class="stage">' + scenePorch(LIGHT.dusk, {bruce: "stand_stick", bx: 470, bs: 0.84, cat: true}) + '</div>'
    + '<div class="scroll"><div class="pad">'
    + '<div><div class="kicker" style="font:600 11px/1 \'IBM Plex Mono\',monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)">Fourteen days · complete</div>'
    + '<h1 style="font-size:29px;margin-top:6px">' + esc(rec.name.split(" ")[0] || "You") + ', that’s the fortnight.</h1></div>'
    + '<div><span class="band" style="background:' + bandColour(rec.band) + '">' + esc(rec.band) + '</span></div>'
    + '<div class="notice"><b>Provisional.</b> This band comes from your choices and a keyword pass over what you wrote. It is not the outcome. A person at the placement service reads every word you typed and writes the decision.</div>'
    + '<div class="rows">'
    + '<div class="row"><div><b>Rapport</b><div class="sub" style="font-size:12.5px">Does he want you there</div></div><div class="v">' + rec.rapport + ' / 100</div></div>'
    + '<div class="row"><div><b>Autonomy</b><div class="sub" style="font-size:12.5px">Is it still his house</div></div><div class="v">' + rec.autonomy + ' / 100</div></div>'
    + '<div class="row"><div><b>Safety</b><div class="sub" style="font-size:12.5px">Did anyone get hurt</div></div><div class="v">' + rec.safety + ' / 100</div></div>'
    + perLevel + '</div>'
    + '<div><div class="who narr" style="margin-bottom:8px">What the assessor will see first</div>'
    + '<ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px">'
    + rec.reasons.map(function(r){ return '<li class="sub" style="font-size:14px">' + esc(r) + '</li>'; }).join("")
    + '</ul></div>'
    + '<div class="status" id="savestat"><span class="dotled wait"></span><span>Saving to the placement record…</span></div>'
    + '<button class="cont primary" id="dl">Download my responses (.xlsx)</button>'
    + '<div class="status" id="dlstat"><span class="dotled"></span><span>A copy for your records, and for the service if the save above did not go through.</span></div>'
    + '<p class="sub" style="font-size:12.5px">Participant id <span class="mono">' + esc(rec.pid) + '</span> · submitted ' + esc(rec.submittedAt) + '</p>'
    + '</div></div>';

  el("#dl").onclick = function(){
    offerFile("pepaws-porch-" + rec.pid + ".xlsx", participantWorkbook(rec), "dlstat");
  };
}

/* ============================================================
   ASSESSOR VIEW  (open with #assessor)
   ============================================================ */
function renderAssessor(){
  app.className = "wide";
  app.innerHTML =
    '<div class="topbar"><div class="toprow"><span class="daylabel">Pepaws Porch · assessor</span>'
    + '<span class="clock" id="acount">loading…</span></div></div>'
    + '<div class="scroll"><div class="pad">'
    + '<h1 style="font-size:26px">Submissions</h1>'
    + '<p class="sub">Every run written to the placement record, newest first. Bands are provisional: the assessor column is what counts, and it is filled in by a person. Anyone who can open this artifact can open this page — it is a convenience, not an access control.</p>'
    + '<div class="arow"><button class="cont" id="refresh">Refresh</button>'
    + '<button class="cont primary" id="exp">Export workbook (.xlsx)</button>'
    + '<span class="pill" id="src">reading…</span></div>'
    + '<div class="status" id="astat"><span class="dotled wait"></span><span>Reading the placement record…</span></div>'
    + '<div class="awrap"><table class="atable" id="atable"><thead><tr>'
    + '<th>Participant</th><th>Name</th><th>Submitted</th><th>Rap</th><th>Aut</th><th>Saf</th>'
    + '<th>Provisional</th><th>Flags</th></tr></thead><tbody><tr><td colspan="8">…</td></tr></tbody></table></div>'
    + '</div></div>';

  var records = [];
  var draw = function(){
    var tb = el("#atable tbody");
    if (!records.length){ tb.innerHTML = '<tr><td colspan="8">No submissions yet.</td></tr>'; return; }
    tb.innerHTML = records.map(function(r){
      var flags = [];
      if (r.hardStop) flags.push("hard stop");
      if (r.declined) flags.push("declined");
      (r.watchFlags || []).forEach(function(w){ flags.push(w); });
      return '<tr><td class="mono">' + esc(r.pid) + '</td><td>' + esc(r.name) + '</td>'
        + '<td class="mono" style="font-size:12px">' + esc((r.submittedAt || "").replace("T", " ").slice(0, 16)) + '</td>'
        + '<td class="mono">' + esc(r.rapport) + '</td><td class="mono">' + esc(r.autonomy) + '</td><td class="mono">' + esc(r.safety) + '</td>'
        + '<td><span class="pill" style="background:' + bandColour(r.band) + ';color:#F6F2E8">' + esc(r.band) + '</span></td>'
        + '<td class="sub" style="font-size:12.5px">' + esc(flags.join(", ")) + '</td></tr>';
    }).join("");
  };

  var load = function(){
    setStatus("astat", "wait", "Reading the placement record…");
    getCap("db").then(function(db){
      if (!db){
        el("#src").textContent = "no record store";
        setStatus("astat", "no", "The shared record is not available in this view. Collect the .xlsx files participants downloaded instead.");
        el("#acount").textContent = "0";
        records = []; draw(); return;
      }
      el("#src").textContent = "shared record";
      db.collection("submissions").orderBy("submittedAt", "desc").limit(500).get().then(function(snap){
        records = snap.docs.map(function(d){ return d.data(); }).filter(Boolean);
        el("#acount").textContent = records.length + " submission" + (records.length === 1 ? "" : "s");
        setStatus("astat", "ok", "Read " + records.length + " submission" + (records.length === 1 ? "" : "s") + ".");
        draw();
      }, function(err){
        setStatus("astat", "no", "Could not read the record (" + ((err && err.code) || "unavailable") + ").");
        el("#acount").textContent = "—";
      });
    });
  };

  el("#refresh").onclick = load;
  el("#exp").onclick = function(){
    if (!records.length){ setStatus("astat", "wait", "Nothing to export yet."); return; }
    offerFile("pepaws-porch-responses.xlsx", assessorWorkbook(records), "astat");
  };
  load();
}

/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  S = freshState();
  if ((location.hash || "").replace("#", "").toLowerCase() === "assessor"){ S.view = "assessor"; }
  render();
}
boot();
</script>
