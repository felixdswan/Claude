<title>Pepaws Porch Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Pepaws Porch quick demo — one weatherboard cottage in real light, drawn soft.
   A committed single visual world: every surface is painted explicitly so
   the page holds on either host ground. Layout: one phone-width card for the
   applicant; a wide two-pane review desk for staff. */
:root{
  --surround:#2B302C; --surround-2:#232823;
  --paper:#EFE9DD; --card:#F8F3E9; --card-2:#E7DFCF; --sunk:#DED5C2; --field:#FDFAF3;
  --ink:#31302B; --ink-2:#6B6459; --ink-3:#8A8171;
  --line:#CDC3B0; --line-2:#B5A995;
  --sage:#6F7C5A; --sage-lo:#5A6649; --slate:#5B6C74; --slate-lo:#4E5D64;
  --rust:#A8563E; --ochre:#BE9350; --clay:#A8785F; --rose:#B98585;
  --good:#5F7A50; --warn:#B08A3C; --bad:#A2523C; --on-dark:#F6F2E8;
  --display:Fraunces,Georgia,serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  background:var(--surround);
  background-image:radial-gradient(120% 90% at 50% 0%, #333A34 0%, var(--surround) 45%, var(--surround-2) 100%);
  color:var(--ink);
  font:400 16px/1.55 var(--body);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;padding:16px;
}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:600;line-height:1.12;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--slate);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.kicker{font:600 11px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3)}

#app{
  width:100%;max-width:468px;height:min(94vh,880px);min-height:560px;
  background:var(--card);border-radius:18px;overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.42);
  display:flex;flex-direction:column;position:relative;
  margin:auto; /* centres when there's room, never pushes the top off-screen when there isn't */
}
#app.wide{max-width:1240px;height:min(96vh,1000px)}

.topbar{flex:none;background:var(--card-2);border-bottom:1px solid var(--line);padding:10px 14px 11px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pause{background:transparent;border:1px solid var(--line-2);border-radius:7px;padding:5px 9px;font-size:12px;font-weight:600}
.daylabel{font:600 12px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.clock{font:500 12px/1 var(--mono);color:var(--ink-3);margin-left:auto}

.stage{flex:none;position:relative;background:#B9C6CC;line-height:0}
.stage svg{display:block;width:100%;height:auto}
.stagenote{position:absolute;left:12px;top:12px;font:500 10px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--on-dark);background:rgba(31,34,30,.5);padding:5px 8px;border-radius:5px}

.panel{flex:1;min-height:0;overflow-y:auto;padding:16px 16px 20px;display:flex;flex-direction:column;gap:13px;background:var(--card)}
.panel::-webkit-scrollbar,.scroll::-webkit-scrollbar{width:8px}
.panel::-webkit-scrollbar-thumb,.scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.who{font:700 11px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--rust)}
.who.narr{color:var(--ink-3)}
.line{font-size:17px;line-height:1.5;color:var(--ink)}
.prompt{font-family:var(--display);font-size:19px;font-weight:600;line-height:1.25}
.sub{font-size:13.5px;line-height:1.5;color:var(--ink-2)}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--card);border:1px solid var(--line-2);border-radius:10px;padding:12px 14px;font-size:15.5px;line-height:1.4;transition:background .14s,border-color .14s}
.opt:hover{background:var(--field);border-color:var(--slate)}

.cont{align-self:flex-start;background:var(--slate);color:var(--on-dark);border:0;border-radius:9px;padding:11px 20px;font-weight:600;font-size:15px}
.cont:hover{background:var(--slate-lo)}
.cont.primary{background:var(--sage)}
.cont.primary:hover{background:var(--sage-lo)}
.cont.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line-2)}
.cont.ghost:hover{background:var(--field)}
.cont[disabled]{background:var(--line-2);color:var(--on-dark);cursor:default}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

textarea{width:100%;min-height:132px;resize:vertical;padding:12px 13px;border-radius:10px;border:1px solid var(--line-2);background:var(--field);color:var(--ink);font:400 15.5px/1.5 var(--body)}
textarea:focus{border-color:var(--slate);outline:none;box-shadow:0 0 0 3px rgba(91,108,116,.16)}

.timer{flex:none;height:4px;background:var(--sunk);position:relative;overflow:hidden}
.timer i{display:block;height:100%;background:var(--rust);width:100%}
.timerlabel{font:600 11px/1 var(--mono);letter-spacing:.08em;color:var(--rust);text-transform:uppercase}

.notice{border-left:3px solid var(--ochre);background:#F2EADA;padding:11px 13px;border-radius:0 8px 8px 0;font-size:14px;line-height:1.5;color:var(--ink-2)}
.notice b{color:var(--ink)}

.scroll{flex:1;min-height:0;overflow-y:auto}
.pad{padding:20px 18px 24px;display:flex;flex-direction:column;gap:14px}
.title h1{font-size:38px;letter-spacing:-.01em}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--ink-2)}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],input[type=time],select{padding:10px 12px;border:1px solid var(--line-2);border-radius:9px;background:var(--field);font:400 15.5px/1.4 var(--body);color:var(--ink);width:100%}
input:focus,select:focus{border-color:var(--slate);outline:none;box-shadow:0 0 0 3px rgba(91,108,116,.16)}
.check{flex-direction:row;align-items:flex-start;gap:9px;font-weight:400;font-size:13.5px;line-height:1.45;color:var(--ink-2);cursor:pointer}
.check input{margin-top:3px;width:17px;height:17px;accent-color:var(--sage);flex:none}
.err{font-size:13px;color:var(--rust);font-weight:600}

/* questionnaire */
.qhead{display:flex;flex-direction:column;gap:6px}
.qprog{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
.qprog i{height:4px;border-radius:2px;background:var(--sunk)}
.qprog i.on{background:var(--sage)}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qgrid .full{grid-column:1 / -1}
.qfield{display:flex;flex-direction:column;gap:6px;min-width:0}
.qlabel{display:block;font-size:13.5px;font-weight:600;color:var(--ink)}
.qlabel .opt-tag{font-weight:400;color:var(--ink-3)}
.qhint{font-size:12px;color:var(--ink-3);line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-2);background:var(--field);border-radius:999px;padding:6px 12px;font-size:13.5px;line-height:1.2;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--sage);border-color:var(--sage);color:var(--on-dark)}
.qfield.bad .qlabel{color:var(--rust)}
.qfield.bad input,.qfield.bad select{border-color:var(--rust)}
.qsec{font:600 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding-top:6px;border-top:1px solid var(--line)}
@media (max-width:420px){.qgrid{grid-template-columns:1fr}}

/* results */
.band{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:8px 15px;font-weight:700;font-size:14px;color:var(--on-dark)}
.rows{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.status{font-size:13px;color:var(--ink-2);display:flex;align-items:flex-start;gap:7px}
.status .dotled{margin-top:6px}
.dotled{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ink-3)}
.dotled.ok{background:var(--good)} .dotled.no{background:var(--bad)} .dotled.wait{background:var(--warn)}

/* the participant's demo match */
.matchcard{border:1px solid var(--line-2);border-radius:14px;background:var(--field);padding:16px;display:flex;flex-direction:column;gap:10px}
.mc-kicker{font:600 11px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--sage-lo)}
.mc-head{display:flex;align-items:center;gap:12px}
.mc-avatar{width:54px;height:54px;border-radius:50%;background:var(--sage);color:var(--on-dark);display:grid;place-items:center;font:600 19px/1 var(--display);flex:none}
.mc-who{flex:1;min-width:0}
.mc-name{font:600 21px/1.2 var(--display)}
.mc-sub{font-size:13.5px;color:var(--ink-2)}
.mc-score{display:flex;flex-direction:column;align-items:center;background:var(--sage);color:var(--on-dark);border-radius:10px;padding:7px 10px;flex:none}
.mc-score b{font:700 22px/1 var(--mono)}
.mc-score span{font:600 10px/1.5 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.mc-why{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;font-size:14.5px;line-height:1.4}
.mc-why li{padding-left:20px;position:relative}
.mc-why li::before{content:"✓";position:absolute;left:2px;color:var(--good);font-weight:700}
.mc-talk{font-size:13.5px;line-height:1.45;color:var(--ink-2);margin:0}
.mc-note{font-size:12px;color:var(--ink-3);margin:0}
.matchcard.mc-wait{border-style:dashed}
.matchcard.mc-out{background:var(--paper)}
.mc-list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.45}

/* staff review desk */
.desk{flex:1;min-height:0;display:grid;grid-template-columns:330px 1fr;background:var(--paper)}
.queue{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--card)}
.qtools{padding:12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.qlist{flex:1;min-height:0;overflow-y:auto;list-style:none;margin:0;padding:0}
.qitem{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:11px 12px;display:grid;grid-template-columns:1fr auto;gap:3px 10px}
.qitem:hover{background:var(--field)}
.qitem[aria-current="true"]{background:var(--card-2);box-shadow:inset 3px 0 0 var(--sage)}
.qitem .nm{font-weight:700;font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qitem .when{font:500 11px/1.6 var(--mono);color:var(--ink-3)}
.qitem .meta{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:5px}
.pill{font:600 10.5px/1 var(--mono);letter-spacing:.04em;padding:5px 8px;border-radius:999px;background:var(--sunk);color:var(--ink-2)}
.pill.dark{color:var(--on-dark)}
.viewer{display:flex;flex-direction:column;min-width:0;min-height:0}
.vbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--card)}
.vbar .grow{flex:1;min-width:120px}
.vbody{flex:1;min-height:0;display:grid;grid-template-columns:1fr 260px}
.vbody iframe{width:100%;height:100%;border:0;background:#eceef1;display:block}
.review{border-left:1px solid var(--line);background:var(--card);overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.review h3{font-size:16px}
.review label{font-size:12px}
.review select,.review input,.review textarea{font-size:14px;padding:8px 10px}
.review textarea{min-height:76px}
.empty-state{padding:28px 20px;display:flex;flex-direction:column;gap:8px;color:var(--ink-2);font-size:14px}
.cont.small{padding:7px 12px;font-size:13px}
/* hosts and matches */
.tabs{display:flex;gap:6px;margin-top:9px}
.tab{background:transparent;border:1px solid var(--line-2);border-radius:8px;padding:6px 12px;font:600 13px/1.2 var(--body);color:var(--ink-2)}
.tab:hover{background:var(--field)}
.tab[aria-selected="true"]{background:var(--slate);border-color:var(--slate);color:var(--on-dark)}
.matchbody{flex:1;min-height:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.secthead{font:600 11px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin-top:4px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 13px;display:flex;flex-direction:column;gap:9px}
.mhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.mhead b{font-size:15px}
.mhead .amp{font-size:13px;color:var(--ink-3)}
.mhead .grow{flex:1}
.mhead label{flex-direction:row;align-items:center;gap:6px;font-size:12px}
.mhead select{width:auto;padding:6px 8px;font-size:13px}
.score{font:700 13px/1 var(--mono);min-width:36px;text-align:center;padding:7px 6px;border-radius:8px;color:var(--on-dark);background:var(--slate)}
.mparts{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px 12px}
.mpart{font:500 11px/1.3 var(--mono);color:var(--ink-2);display:flex;flex-direction:column;gap:3px}
.mpart i{display:block;height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}
.mpart i b{display:block;height:100%;background:var(--sage)}
.why{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13.5px;line-height:1.4;color:var(--ink)}
.why li{padding-left:19px;position:relative}
.why li::before{position:absolute;left:2px;top:0;font-weight:700}
.why .ok::before{content:"✓";color:var(--good)}
.why .warn::before{content:"!";color:var(--warn)}
.why .no::before{content:"✕";color:var(--bad)}
.mcard details summary,details.out summary{cursor:pointer;font-size:13px;color:var(--ink-2)}
.mcard details .why{margin-top:6px}
details.out{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 13px}
details.out .why{margin-top:8px}
.hfacts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px 16px;font-size:13.5px;line-height:1.4}
.hfacts div{display:flex;flex-direction:column;gap:1px}
.hfacts span{font:600 10.5px/1.4 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.linkbtn{background:none;border:0;padding:0;font:inherit;font-weight:700;color:var(--slate);text-decoration:underline;cursor:pointer}
.bestfor{display:flex;flex-direction:column;gap:7px}
.bestfor:empty{display:none}
.bestfor .hrow{display:flex;align-items:center;gap:8px;font-size:13px;line-height:1.3}
.bestfor .hrow .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.bestfor .hrow small{color:var(--ink-3);font-size:11.5px}
.bestfor .score{min-width:32px;padding:6px 4px;font-size:12px}
.sides{display:flex;flex-wrap:wrap;gap:6px 16px;font:500 12px/1.3 var(--mono);color:var(--ink-2)}
.sides b{font-weight:700;color:var(--ink)}
details.parts summary{cursor:pointer;font-size:13px;color:var(--ink-2)}
details.parts .secthead{margin-top:10px}
details.parts .mparts{margin-top:6px}
/* the live board */
.board{flex:1;min-height:0;overflow-y:auto;background:var(--paper);padding:18px;display:flex;flex-direction:column;gap:16px}
.board:fullscreen{padding:32px}
.board-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px}
.board-head h2{font-size:30px;margin-top:4px}
.board-head .grow{flex:1;min-width:220px}
.board-stats{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:15px;color:var(--ink-2)}
.board-stats b{font:700 20px/1 var(--mono);color:var(--ink)}
.board-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.bcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.bcard.fresh{border-color:var(--sage);box-shadow:0 0 0 3px rgba(111,124,90,.25)}
.bcard.arrive{animation:arrive .6s ease-out}
@keyframes arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.bcard.arrive{animation:none}}
.b-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.b-person{font:600 24px/1.15 var(--display)}
.b-when{font:500 12px/1 var(--mono);color:var(--ink-3)}
.b-arrow{font:600 11px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.b-host{display:flex;align-items:center;gap:10px}
.b-avatar{width:44px;height:44px;border-radius:50%;background:var(--sage);color:var(--on-dark);display:grid;place-items:center;font:600 16px/1 var(--display);flex:none}
.b-name{font:600 19px/1.2 var(--display);flex:1;min-width:0}
.b-score{font:700 18px/1 var(--mono);background:var(--sage);color:var(--on-dark);border-radius:9px;padding:7px 9px}
.b-sub{font-size:13.5px;color:var(--ink-2)}
.b-why{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:14px;line-height:1.4}
.b-why li{padding-left:18px;position:relative}
.b-why li::before{content:"✓";position:absolute;left:1px;color:var(--good);font-weight:700}
.bcard.waiting{border-style:dashed}
.bcard.out{background:var(--paper)}
.b-state{font:600 19px/1.2 var(--display)}
@media (max-width:900px){
  #app.wide{height:auto;min-height:94vh}
  .desk{grid-template-columns:1fr}
  .queue{border-right:0;border-bottom:1px solid var(--line);max-height:42vh}
  .vbody{grid-template-columns:1fr}
  .vbody iframe{height:70vh}
  .review{border-left:0;border-top:1px solid var(--line)}
}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
<div id="app" role="application" aria-label="Pepaws Porch quick demo"></div>
<script>
"use strict";
/* ============================================================
   PEPAWS PORCH — scenes
   One weatherboard cottage and its back yard, drawn as soft SVG.
   Every room is a function of the light and a few props, so a day can
   show exactly what its story mentions and nothing it doesn't.
   ============================================================ */

/* ---------- light presets: one cottage, different hours ---------- */
var LIGHT = {
  day:   {s1:"#A7BDCB", s2:"#DCE1D8", amb:"",                      warm:"#F2E4C4", glow:0},
  gold:  {s1:"#BCC0B4", s2:"#EEDCB6", amb:"rgba(214,158,78,0.14)",  warm:"#FBEBC6", glow:0.25},
  grey:  {s1:"#9FA9A9", s2:"#C9CBC2", amb:"rgba(96,104,112,0.13)",  warm:"#DCDCD2", glow:0.1},
  dusk:  {s1:"#5E6E82", s2:"#C39E85", amb:"rgba(58,64,94,0.28)",    warm:"#E7C48F", glow:0.6},
  night: {s1:"#2C3542", s2:"#495062", amb:"rgba(20,26,42,0.34)",    warm:"#F0D08A", glow:0.85}
};

function R(x, y, w, h, fill, extra){
  return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'"'+(extra ? " "+extra : "")+'/>';
}
function P(d, fill, extra){ return '<path d="'+d+'" fill="'+fill+'"'+(extra ? " "+extra : "")+'/>'; }
function C(cx, cy, r, fill, extra){ return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+fill+'"'+(extra ? " "+extra : "")+'/>'; }
function E(cx, cy, rx, ry, fill, extra){ return '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="'+fill+'"'+(extra ? " "+extra : "")+'/>'; }
function SL(d, stroke, w, extra){ return '<path d="'+d+'" fill="none" stroke="'+stroke+'" stroke-width="'+w+'" stroke-linecap="round"'+(extra ? " "+extra : "")+'/>'; }
/* a soft contact shadow — blurred, so objects sit on surfaces instead of floating */
function shade(cx, cy, rx, ry, o){ return E(cx, cy, rx, ry, "#262A22", 'opacity="'+(o || 0.22)+'" filter="url(#blur)"'); }

function defsFor(L){
  return '<defs>'
    + '<filter id="blur" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="3.2"/></filter>'
    + '<filter id="blurBig" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>'
    + '<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+L.s1+'"/><stop offset="1" stop-color="'+L.s2+'"/></linearGradient>'

/* ---------- foliage: many small leaves, not one blob ---------- */
var GREENS = ["#7E8C67", "#66754F", "#93A07C"];
var GREENS_D = ["#5D6A4C", "#4B573C", "#6E7B5B"];
var GUM = ["#7F9283", "#6B7F70", "#97A797"];
function bush(cx, cy, w, h, hue, seed){
  var out = E(cx, cy, (w*0.8).toFixed(1), (h*0.74).toFixed(1), hue[1]);
  for (var i = 0; i < 26; i++){
    var a = (i*2.399 + seed) % 6.283, r = 0.35 + ((i*37 + seed*11) % 100)/155;
    var rr = 5 + ((i*13 + seed*7) % 9);
    out += E((cx + Math.cos(a)*w*r).toFixed(1), (cy + Math.sin(a)*h*r*0.85).toFixed(1), rr, (rr*0.82).toFixed(1), i % 3 === 0 ? hue[1] : (i % 3 === 1 ? hue[0] : hue[2]));
  }
  return '<g>' + out + '</g>';
}
function gumTree(x, base, h, seed){
  var t = SL("M "+x+" "+base+" C "+(x-4)+" "+(base-h*0.4)+" "+(x+6)+" "+(base-h*0.6)+" "+(x-2)+" "+(base-h*0.85), "#D9D2C2", 9)
    + SL("M "+x+" "+(base-h*0.5)+" C "+(x+14)+" "+(base-h*0.62)+" "+(x+22)+" "+(base-h*0.72)+" "+(x+26)+" "+(base-h*0.86), "#CFC6B3", 5)
    + SL("M "+(x-2)+" "+(base-h*0.2)+" L "+(x-1)+" "+(base-h*0.4), "#B9AF9B", 2);
  return t + bush(x-6, base-h*0.9, 46, 34, GUM, seed) + bush(x+24, base-h*0.82, 34, 26, GUM, seed+3);
}

function curls(list, fill){

function margHead(cx, cy, tilt, mood, outfit){
  var g = '<g transform="translate('+cx+','+cy+') rotate('+(tilt || 0)+')">';
  g += curls([[-11,-3,7],[11,-3,7],[-9,-11,8],[9,-11,8],[0,-15,9],[-12.5,5,5],[12.5,5,5]], HAIR_D);
  g += E(-11.8, 2, 2.6, 3.6, SKIN_D) + E(11.8, 2, 2.6, 3.6, SKIN_D)
    +  C(-12.1, 6.6, 1.5, "#F7F2E8") + C(12.1, 6.6, 1.5, "#F7F2E8");
  g += E(0, 1, 11.5, 13.5, "url(#skin)")
    +  P("M -11 4 C -9 13 -4 15 0 15 C 4 15 9 13 11 4 C 8 11 -8 11 -11 4 Z", SKIN_D, 'opacity="0.35"')
    +  E(-6.6, 6.2, 3, 2, BLUSH, 'opacity="0.4"') + E(6.6, 6.2, 3, 2, BLUSH, 'opacity="0.4"');
  if (mood === "pain"){
    g += SL("M -7 0.4 Q -5 1.8 -3 0.4", "#3B322D", 1.2) + SL("M 3 0.4 Q 5 1.8 7 0.4", "#3B322D", 1.2);
  } else {
    g += E(-5, 0, 1.25, 1.6, "#3B322D") + E(5, 0, 1.25, 1.6, "#3B322D")
      +  C(-4.6, -0.6, 0.45, "#FFFFFF") + C(5.4, -0.6, 0.45, "#FFFFFF");
  }
  var brow = mood === "sad" || mood === "pain" ? ["M -8.5 -5 Q -5.5 -6.8 -2.6 -6.2", "M 2.6 -6.2 Q 5.5 -6.8 8.5 -5"]
                                                : ["M -8.4 -5.6 Q -5.4 -7.2 -2.4 -6", "M 2.4 -6 Q 5.4 -7.2 8.4 -5.6"];
  g += SL(brow[0], "#B3AA9C", 1.3) + SL(brow[1], "#B3AA9C", 1.3);
  g += C(-5, 0, 4.3, "#DCE6E8", 'fill-opacity="0.26" stroke="'+FRAME+'" stroke-width="1.05"')
    +  C(5, 0, 4.3, "#DCE6E8", 'fill-opacity="0.26" stroke="'+FRAME+'" stroke-width="1.05"')
    +  SL("M -0.8 -0.5 Q 0 -1.6 0.8 -0.5", FRAME, 1) + SL("M -9.3 -0.6 L -11.4 0.4", FRAME, 1) + SL("M 9.3 -0.6 L 11.4 0.4", FRAME, 1);
  g += SL("M 0.2 2.2 Q 1.8 4.9 0 5.7", SKIN_D, 1);
  var mouth = {smile:"M -3.6 9 Q 0 11.8 3.6 9", neutral:"M -3 9.8 Q 0 10.4 3 9.8", sad:"M -3 10.6 Q 0 9 3 10.6", pain:"M -3.2 10.2 Q 0 8.8 3.2 10.6"};
  g += SL(mouth[mood] || mouth.smile, "#A86E5C", 1.3);
  g += curls([[-7,-12.5,5],[-1,-14,5.6],[5.6,-12.8,5],[10,-8.4,3.9],[-10.4,-8,3.9]], HAIR)
    +  SL("M -6 -16.6 Q 0 -19.5 6 -16.6", "#FFFFFF", 1.3, 'stroke-opacity="0.55"');
  if (outfit === "garden"){
    g += E(0, -13, 21, 5.2, "#D8BE86") + P("M -11 -14 Q -10 -25 0 -25 Q 10 -25 11 -14 Z", "#CDB176") + R(-11, -17, 22, 3, "#8E9677");
  } else if (outfit === "funeral"){
    g += E(0, -14, 14.5, 3.4, "#2B2F39") + P("M -9 -15 Q -8 -23 0 -23 Q 8 -23 9 -15 Z", "#333845");
  }
  return g + '</g>';
}

function frame(x, y, w, h, inner){

function window2(x, y, w, h, L, curtain){
  var s = R(x-6, y-6, w+12, h+12, "#EFE8DA", 'rx="2"') + R(x, y, w, h, "url(#glassg)");
  if (L.glow > 0.3) s += R(x, y, w, h, L.warm, 'opacity="'+(L.glow*0.55).toFixed(2)+'"');

    +  P("M "+(x+4)+" "+(y+4)+" L "+(x+w*0.35)+" "+(y+4)+" L "+(x+4)+" "+(y+h*0.3)+" Z", "#FFFFFF", 'opacity="0.22"');

  }
  return s + R(x-10, y+h+6, w+20, 6, "#E3DACA", 'rx="1.5"') + shade(x+w/2, y+h+16, w*0.5, 3, 0.12);
}
function pot(x, y, w, hue, seed, bloom){
  var s = shade(x, y+1, w*0.7, 3.5) + P("M "+(x-w/2)+" "+(y-w*0.9)+" L "+(x+w/2)+" "+(y-w*0.9)+" L "+(x+w*0.38)+" "+y+" L "+(x-w*0.38)+" "+y+" Z", "#B07B5F")
    + R(x-w/2-2, y-w*0.9-5, w+4, 6, "#9C6A50", 'rx="2"') + bush(x, y-w*1.4, w*0.62, w*0.5, hue, seed);
  if (bloom) for (var i = 0; i < 6; i++) s += C((x - w*0.4 + i*w*0.16).toFixed(1), (y - w*1.5 - (i%2)*w*0.3).toFixed(1), 3, bloom);
  return s;
}
function teapot(x, y){

<script>
"use strict";
/* ============================================================
   ENGINE
   ============================================================ */
var app = document.getElementById("app");
var VERSION = "demo-1.1";
var START_METER = 5;
var SAVE_KEY = "pepaws-porch-demo-v1";
var METERS = ["connection", "respect", "reliability", "awareness"];

var S = null;
function freshState(){
  return {
    view: "title", version: VERSION, pid: null, name: "", email: "", studyArea: "health",
    consentAt: null, startedAt: null, gameEndedAt: null, submittedAt: null,
    di: 0, si: 0, phase: "step",
    meters: {connection: START_METER, respect: START_METER, reliability: START_METER, awareness: START_METER},
    flags: {}, tags: {}, pathByDay: {},
    motivation: "", choices: [], concerns: [], pending: null, stepEnteredAt: null,
    q: {}, qPage: 0, qPrefilled: false, synced: false, demoMatch: null, matchPending: false
  };
}

/* ---------- utilities ---------- */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function el(sel){ return app.querySelector(sel); }
function nowISO(){ return new Date().toISOString(); }
function secsSince(t){ return t ? Math.round((Date.now() - t) / 100) / 10 : 0; }

/* Progress is kept in this browser so a refresh doesn't lose your place.
   It is cleared once the profile reaches the placement record. */
function save(){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* private mode, blocked storage */ }
}
function loadSaved(){
  try {
    var raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    var v = JSON.parse(raw);
    if (!v || !v.pid || !v.view) return null;
    /* A run part-way through an older version can't resume: the days have changed since. */
    if (v.version !== VERSION && ["play", "paused"].indexOf(v.view) !== -1) return null;
    var base = freshState();
    Object.keys(base).forEach(function(key){ if (v[key] == null) v[key] = base[key]; });
    METERS.forEach(function(key){ if (v.meters[key] == null) v.meters[key] = START_METER; });
    if (!DISCIPLINES[v.studyArea]) v.studyArea = "other";
    return v;
  } catch (e) { return null; }
}
function clearSaved(){ try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

/* "nine", for sentences that count the days. */
function daysInWords(){
  return ["no", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten", "eleven", "twelve"][DAYS.length] || String(DAYS.length);
}

function makePid(){
  return "DEMO-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
}

/* ---------- timer (single active) ---------- */
var timerHandle = null, tickHandle = null;
function clearTimer(){
  if (timerHandle) { clearTimeout(timerHandle); timerHandle = null; }
  if (tickHandle) { clearInterval(tickHandle); tickHandle = null; }
  if (S) S.timerDeadline = null;
}
function runTimer(seconds, onExpire){
  clearTimer();
  var bar = el("#tbar"), label = el("#tlabel");
  var endAt = Date.now() + seconds * 1000;
  if (bar){
    bar.style.width = "100%";
    bar.style.transition = "width " + seconds + "s linear";
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ bar.style.width = "0%"; }); });
  }
  if (label){
    var tick = function(){ label.textContent = Math.max(0, Math.ceil((endAt - Date.now()) / 1000)) + "s"; };
    tick();
    tickHandle = setInterval(tick, 250);
  }
  timerHandle = setTimeout(function(){ clearTimer(); onExpire(); }, seconds * 1000);
  S.timerDeadline = endAt;
}

/* ---------- effects ---------- */
function applyFx(f){
  if (!f) return;
  METERS.forEach(function(key){
    if (f[key] !== undefined) S.meters[key] = Math.max(0, Math.min(10, S.meters[key] + f[key]));
  });
}
function choiceScore(c){ return (c.connection || 0) + (c.respect || 0) + (c.reliability || 0) + (c.awareness || 0); }

/* ---------- path tiers: recalculated each morning ---------- */
function pathTier(){
  var m = S.meters;
  if (m.connection >= 7 && m.respect >= 7) return "warm";
  if (m.connection <= 3 || m.respect <= 3) return "distant";
  return "steady";
}
function pathTierForDay(n){ return S.pathByDay[String(n)] || pathTier(); }

/* ---------- the lowest moment, for staff ---------- */
function findLowestMoment(){
  var low = null;
  S.choices.forEach(function(c){
    var score = choiceScore(c);
    if (score < 0 && (!low || score < low.score))
      low = {day: c.day, score: score, note: c.timedOut ? "No answer in time (" + c.title + ")" : LOW_NOTES[c.tag] || c.chosen.replace(/\.$/, "")};
  });
  return low;
}

/* ---------- days, openings and step availability ---------- */
function hasAll(list, set){ return (list || []).every(function(k){ return !!set[k]; }); }
function hasAny(list, set){ return !list || !list.length || list.some(function(k){ return !!set[k]; }); }
function hasNone(list, set){ return !(list || []).some(function(k){ return !!set[k]; }); }

function dayForIndex(index){
  var day = DAYS[index], key = String(day.n);
  if (!S.pathByDay[key]){ S.pathByDay[key] = pathTier(); save(); }
  return day;
}
function stepIsAvailable(step){
  return hasAll(step.requiresTags, S.tags) && hasAny(step.requiresAnyTags, S.tags)
    && hasAll(step.requiresFlags, S.flags) && hasNone(step.excludesFlags, S.flags);
}
function enterStep(){
  S.phase = "step";
  S.stepEnteredAt = Date.now();
  save();
  render();
}
function nextStep(){
  clearTimer();
  var day = dayForIndex(S.di);
  var next = S.si + 1;
  while (next < day.steps.length && !stepIsAvailable(day.steps[next])) next++;
  if (next < day.steps.length){ S.si = next; enterStep(); return; }
  if (S.di + 1 < DAYS.length){
    S.di++; S.si = 0;
    day = dayForIndex(S.di);
    while (S.si < day.steps.length && !stepIsAvailable(day.steps[S.si])) S.si++;
    enterStep(); return;
  }
  endGame();
}

/* ============================================================
   VIEWS
   ============================================================ */
function render(){
  clearTimer();
  app.className = "";
  if (S.view === "paused") return renderPaused();
  if (S.view === "play") return renderPlay();
  if (S.view === "questionnaire") return renderQuestionnaire();
  if (S.view === "results") return renderResults();
  if (S.view === "staff") return renderStaff();
  renderTitle();
}

function pauseRun(){
  if (S.view !== "play") return;
  S.pausedFrom = S.view;
  S.pauseStartedAt = Date.now();
  if (S.timerDeadline){
    S.timerRemaining = Math.max(1, Math.ceil((S.timerDeadline - Date.now()) / 1000));
    S.timerDeadline = null;
  }

/* ---------- play ---------- */
function sceneFor(day){
  return (SCENES[day.zone] || scenePorch)(LIGHT[day.light] || LIGHT.day, day.scene || {});
}
function topbarHTML(day){
  return '<div class="topbar"><div class="toprow">'
    + '<span class="daylabel">Day ' + day.show + ' of ' + DAYS.length + ' · ' + esc(day.title) + '</span>'
    + '<span class="clock">' + esc(day.time) + '</span><button class="pause" id="pause">Pause</button></div></div>';
}

function renderPlay(){
  var day = dayForIndex(S.di);
  var step = day.steps[S.si];
  if (!step || !stepIsAvailable(step)){ nextStep(); return; }
  var timed = S.phase === "step" && step.t === "choice"; /* every question is timed */
  app.innerHTML = topbarHTML(day)
    + '<div class="stage">' + sceneFor(day) + '<div class="stagenote">' + esc(ZONE_LABEL[day.zone] || "") + '</div></div>'
    + (timed ? '<div class="timer"><i id="tbar"></i></div>' : '')
    + '<div class="panel" id="panel"></div>';
  if (S.phase === "reply") renderReply();
  else if (step.t === "say") renderSay(day, step);
  else if (step.t === "choice") renderChoice(day, step);
  bindPause();
}

function flaggedStepText(step){
  var v = step.textByFlag.filter(function(x){ return hasAll(x.requiresFlags, S.flags) && hasNone(x.excludesFlags, S.flags); })[0];
  return v ? v.text : (step.text || "");
}
function renderSay(day, step){
  var text = step.textByFlag ? flaggedStepText(step) : step.pathText && step.pathText[pathTierForDay(day.n)] || step.text;
  el("#panel").innerHTML =
    (step.opening && day.contentNote ? '<div class="notice"><b>Content note:</b> ' + esc(day.contentNote) + '.</div>' : '')
    + '<p class="line">' + esc(storyText(text)) + '</p>'
    + '<button class="cont" id="next">Continue</button>';
  el("#next").onclick = nextStep;
}

function renderChoice(day, step){
  var p = el("#panel");
  var seconds = step.timer || QUESTION_SECONDS;
  var html = '<div class="prompt">' + esc(storyText(step.prompt)) + '</div>'
    + '<div class="timerlabel" id="tlabel">' + seconds + 's</div>';
  html += '<div class="opts">' + step.options.map(function(o, i){
    return '<button class="opt" data-i="' + i + '">' + esc(storyText(o.text)) + '</button>';
  }).join("") + '</div>';
  p.innerHTML = html;
  Array.prototype.forEach.call(p.querySelectorAll(".opt"), function(b){
    b.onclick = function(){ choose(day, step, parseInt(b.getAttribute("data-i"), 10), false); };
  });

  S.timerRemaining = null;
  runTimer(duration, function(){ choose(day, step, -1, true); });
}

function recordChoice(day, step, option, f, timedOut, seconds){
  S.choices.push({
    day: day.n, title: day.title, prompt: storyText(step.prompt),
    chosen: timedOut ? "(no response — timed out)" : storyText(option.text),
    tag: timedOut ? "timeout" : (option.tag || ""),
    connection: f.connection || 0, respect: f.respect || 0, reliability: f.reliability || 0, awareness: f.awareness || 0,
    timedOut: !!timedOut, seconds: seconds
  });
}
function applyOption(option){
  if (option.flag) S.flags[option.flag] = true;
  if (option.tag) S.tags[option.tag] = true;
  (option.setFlags || []).forEach(function(flag){ S.flags[flag] = true; });
}

function choose(day, step, idx, timedOut){
  clearTimer();
  var seconds = secsSince(S.stepEnteredAt);
  var chosen = timedOut ? null : step.options[idx];
  var f = (timedOut ? step.timeoutFx || DEFAULT_TIMEOUT_FX : chosen.fx) || {};
  applyFx(f);
  if (!timedOut){
    applyOption(chosen);
    if (chosen.tag && chosen.tag.indexOf("motivation_") === 0) S.motivation = chosen.tag;
  }
  recordChoice(day, step, chosen, f, timedOut, seconds);
  if (step.noReply){ save(); nextStep(); return; }
  S.pending = {
    heading: timedOut ? "No answer in time" : "",
    reply: timedOut ? (step.timeoutNote || "The moment passes without an answer.")
      : chosen.replyByFlag && S.flags[chosen.replyByFlag.flag] ? chosen.replyByFlag.text : chosen.reply || ""
  };

}

function renderReply(){
  var p = S.pending || {}, day = DAYS[S.di];
  var moreToday = day.steps.slice(S.si + 1).some(stepIsAvailable), last = !moreToday && S.di === DAYS.length - 1;
  el("#panel").innerHTML =
    (p.heading ? '<div class="who narr">' + esc(p.heading) + '</div>' : "")
    + (p.reply ? '<p class="line">' + esc(storyText(p.reply)) + '</p>' : "")
    + (last ? '<p class="line">' + esc(EPILOGUE[pathTier()]) + '</p>' : "")
    + '<button class="cont primary" id="next">' + (moreToday ? "Continue" : last ? "Finish" : "Next day") + '</button>';

}

/* ---------- automatic checks on everything the applicant writes ----------
   Plain word lists, so staff can see exactly why something was flagged. A hit
   quotes the words for staff; threats and drug references also lower the
   meters and keep the profile out of automatic matching. A negation just
   before a match ("I would never hurt her") doesn't count. */
var CONCERNS = [
  {id:"threatening_language", serious:true, label:"Threatening or hostile language",
   re:/\b(or else|bad day for you|you'?ll regret|watch (your|ur) back|(hurt|hit|kill|smack|bash|punch) (you|her|marg)|hurry up and die|(cark|cack)(ing)? it|kick the bucket|(this|it'?s|this is) my (house|home)( now)?|kick (you|her) out|you'?re (useless|a burden))\b/i},
  {id:"drug_references", serious:true, label:"References to illegal drugs",
   re:/\b(meth|methamphetamine|heroin|cocaine|crack ?(pipe|cocaine|head)|(smoke|smoking|do|doing|sell|selling|deal|dealing) (crack|ice|meth|drugs|weed|coke)|on (crack|meth)|^crack$)\b/i},
  {id:"welfare_concern", label:"Possible welfare concern",
   re:/\b(want(ed)? to die|wanna die|kill myself|suicid\w*|end (it all|my life)|self[- ]harm|^(to )?die$)/i},
  {id:"demeaning_language", label:"Demeaning, ageist or crude language",
   re:/\b((?<!my )granny(?! flat)|old (hag|bag|bat|biddy|cow|chook)|boomer|senile|geezer|wrinkl(y|ies)|crone|you old|elderly energy|f+u+c+k\w*|shit|bitch|cunt|stfu|shut up)\b/i}
];
var NEG_BEFORE = /(?:\b(?:not|never|no|nor|without|wouldn'?t|won'?t|don'?t|didn'?t|can'?t|couldn'?t|shouldn'?t)\b|\w+n['’]t\b)[^.!?;]{0,26}$/i;
function firstUnnegated(re, text){
  var g = new RegExp(re.source, re.flags + "g"), m;
  while ((m = g.exec(text)) !== null){
    if (!NEG_BEFORE.test(text.slice(Math.max(0, m.index - 30), m.index))){
      var from = Math.max(0, m.index - 28), to = Math.min(text.length, m.index + m[0].length + 28);
      var cut = text.slice(from, to);
      if (from > 0) cut = cut.replace(/^\S*\s/, "…");
      if (to < text.length) cut = cut.replace(/\s\S*$/, "…");
      return cut.replace(/\s+/g, " ").trim();
    }
    if (g.lastIndex === m.index) g.lastIndex++;
  }
  return null;
}
function scanText(source, text, fromQuestions){
  var hits = [];
  CONCERNS.forEach(function(k){
    var excerpt = firstUnnegated(k.re, String(text || "").replace(/[‘’]/g, "'"));
    if (excerpt){ hits.push(k); S.concerns.push({id: k.id, source: source, excerpt: excerpt, q: !!fromQuestions}); }
  });
  return hits;
}
function hasSeriousConcern(){ return S.concerns.some(function(c){ return CONCERNS.filter(function(k){ return k.id === c.id; })[0].serious; }); }
</script>

function optPairs(f){ return (typeof f.opts === "function" ? f.opts() : f.opts).map(function(o){ return Array.isArray(o) ? o : [o, o]; }); }
function isBlank(v){ return v == null || v === "" || (Array.isArray(v) && !v.length); }
function splitList(text){ return String(text || "").split(/[,\n]/).map(function(x){ return x.trim(); }).filter(Boolean); }

/* Raw answer -> the value the profile contract expects. */
function qValue(f){
  var v = S.q[f.id];

      + (f.other ? '<input type="text" data-q="' + f.id + '__other" maxlength="200" placeholder="Anything else? Separate with commas" value="' + esc(S.q[f.id + "__other"] || "") + '" aria-label="' + esc(f.label) + ': other">' : '');
  } else if (f.type === "yesno" || f.type === "scale" || f.type === "pick"){
    var pairs = f.type === "yesno" ? YES_NO : f.type === "pick" ? f.opts : [1,2,3,4,5].map(function(n){ return [n, String(n)]; });
    ctrl = '<div class="chips" id="' + id + '" role="group">' + pairs.map(function(o){
        return '<button type="button" class="chip" data-one="' + f.id + '" data-v="' + o[0] + '" aria-pressed="' + (v === o[0]) + '">' + o[1] + '</button>';
      }).join("") + '</div>'
      + (f.ends ? '<span class="qhint">1 = ' + esc(f.ends[0]) + ' · 5 = ' + esc(f.ends[1]) + '</span>' : '');
  } else {
    var type = {num:"number", tel:"tel", date:"date", time:"time"}[f.type] || "text";
    ctrl = '<input type="' + type + '" id="' + id + '" data-q="' + f.id + '"' + (f.type === "num" ? ' inputmode="numeric" min="' + f.min + '" max="' + f.max + '"' : ' maxlength="200"')
      + (f.ph ? ' placeholder="' + esc(f.ph) + '"' : '') + ' value="' + esc(v == null ? "" : v) + '">';
  }
  return '<div class="qfield' + (f.full ? ' full' : '') + '" id="qf-' + f.id + '">' + label + ctrl
    + (f.hint ? '<span class="qhint">' + esc(f.hint) + '</span>' : '') + '</div>';
}

function renderQuestionnaire(){
  prefillFromGame();
  prepareMatch();
  var page = Q_PAGES[S.qPage], last = S.qPage === Q_PAGES.length - 1;
  app.innerHTML = '<div class="topbar"><div class="toprow"><span class="daylabel">Matching questions · ' + (S.qPage + 1) + ' of ' + Q_PAGES.length + '</span>'
    + '<span class="clock">About a minute</span></div></div>'
    + '<div class="scroll" id="qscroll"><div class="pad">'
    + '<div class="qhead"><div class="qprog">' + Q_PAGES.map(function(_, i){ return '<i class="' + (i <= S.qPage ? "on" : "") + '"></i>'; }).join("") + '</div>'
    + '<h2 style="font-size:25px;margin-top:8px">' + esc(page.title) + '</h2>'
    + (S.qPage === 0 ? '<p class="sub">Your ' + daysInWords() + ' days with Marg are done. ' + esc(page.intro) + '</p>' : '')
    + '</div>'
    + '<div class="qgrid">' + page.fields.map(qFieldHTML).join("") + '</div>'
    + '<div id="qerr"></div>'
    + '<div class="btnrow">' + (S.qPage > 0 ? '<button class="cont ghost" id="qback">Back</button>' : '')
    + '<button class="cont primary" id="qnext">' + (last ? "Submit my profile" : "Next") + '</button></div>'
    + '</div></div>';

  /* A field flagged by Next stops being flagged as soon as its answer is fine. */
  var recheck = function(id){
    var f = Q_FIELDS.filter(function(x){ return x.id === id; })[0], box = el("#qf-" + id);
    if (f && box && box.classList.contains("bad") && !qInvalid(f)) box.classList.remove("bad");
    if (!app.querySelector(".qfield.bad")) el("#qerr").innerHTML = "";
  };
  Array.prototype.forEach.call(app.querySelectorAll("[data-q]"), function(input){
    input.addEventListener("input", function(){ S.q[input.getAttribute("data-q")] = input.value; save(); recheck(input.getAttribute("data-q").split("__")[0]); });
  });
  Array.prototype.forEach.call(app.querySelectorAll("[data-multi]"), function(b){
    b.onclick = function(){
      var id = b.getAttribute("data-multi"), val = b.getAttribute("data-v"), list = (S.q[id] || []).slice();
      var at = list.indexOf(val);
      if (at === -1) list.push(val); else list.splice(at, 1);
      if (id === "campusDays") list.sort(function(a, c){ return WEEK.indexOf(a) - WEEK.indexOf(c); });
      S.q[id] = list; b.setAttribute("aria-pressed", String(at === -1)); save(); recheck(id);
    };
  });
  Array.prototype.forEach.call(app.querySelectorAll("[data-one]"), function(b){
    b.onclick = function(){
      var id = b.getAttribute("data-one"), raw = b.getAttribute("data-v");
      S.q[id] = raw === "true" ? true : raw === "false" ? false : /^\d+$/.test(raw) ? Number(raw) : raw;
      Array.prototype.forEach.call(b.parentNode.children, function(x){ x.setAttribute("aria-pressed", String(x === b)); });
      save(); recheck(id);
    };
  });
  if (el("#qback")) el("#qback").onclick = function(){ S.qPage--; save(); render(); };
  el("#qnext").onclick = function(){
    var bad = page.fields.filter(function(f){ return f.id && qInvalid(f); });
    page.fields.forEach(function(f){ if (f.id) el("#qf-" + f.id).classList.toggle("bad", bad.indexOf(f) !== -1); });
    if (bad.length){
      el("#qerr").innerHTML = '<p class="err">' + (bad.length === 1 ? "One answer needs" : bad.length + " answers need") + ' a look: ' + esc(bad.map(function(f){ return f.label; }).join(", ")) + '.</p>';
      el("#qf-" + bad[0].id).scrollIntoView({block: "center"});
      return;
    }
    if (!last){ S.qPage++; save(); render(); el("#qscroll").scrollTop = 0; return; }
    scanQuestionnaire();
    S.submittedAt = nowISO();
    S.view = "results"; S.matchPending = true;
    save(); render();
    findDemoMatch().then(function(m){
      S.demoMatch = m; S.matchPending = false;
      save();
      if (S.view === "results") drawMatchCard();
      deliverProfile();
    });
  };
}

/* ============================================================
   PROFILE — builds the GenStay matching profile (contract v1.0)
   from the days with Marg and the matching questions.
   ============================================================ */
var PROFILE_TYPES = {
  connector:             {title:"The Connector",             colour:"var(--good)",  text:"You tended to build connection while keeping respect and boundaries in view."},
  considerate_companion: {title:"The Considerate Companion", colour:"var(--sage)",  text:"Your choices showed consideration, with room for the relationship to grow at its own pace."},
  independent_tenant:    {title:"The Independent Tenant",    colour:"var(--slate)", text:"You tended to be dependable while keeping the relationship more independent."},
  transactional_guest:   {title:"The Transactional Guest",   colour:"var(--clay)",  text:"Your choices leaned towards keeping the arrangement practical and distant. That helps us work out what kind of homeshare would suit you."}
};
var MOTIVATION_CODES = {motivation_study:"quiet_space", motivation_saving:"saving_money", motivation_company:"company", motivation_learning:"learning"};
/* Typed answers in the matching questions get the same checks as the full game’s. */
function scanQuestionnaire(){
  S.concerns = S.concerns.filter(function(c){ return !c.q; });
  Q_FIELDS.forEach(function(f){
    var where = "Matching questions, " + f.label.toLowerCase();
    if (f.type === "text") scanText(where, S.q[f.id], true);
    if (f.type === "list") splitList(S.q[f.id]).forEach(function(item){ scanText(where, item, true); });
    if (f.other) splitList(S.q[f.id + "__other"]).forEach(function(item){ scanText(where, item, true); });
  });
}
/* Answers that can't be right, for staff to ask about. (The one-tap smoking
   and pets questions can't contradict themselves.) */
function answerChecks(){
  var q = S.q, out = [];
  if (!isBlank(q.rentBudgetWeekly) && Number(q.rentBudgetWeekly) < 20) out.push("rent budget of $" + Number(q.rentBudgetWeekly) + " a week");
  return out;
}
/* A plain-English summary for the staff watch-point. Staff can rewrite it. */
function autoWatchPoint(){
  var parts = ["Quick demo: " + daysInWords() + " days of 25-second multiple choice and no written answers, so treat the screening result as a first impression."];
  var missed = S.choices.filter(function(c){ return c.timedOut; });
  if (missed.length) parts.push("Ran out of time on " + missed.length + " of " + S.choices.length + " questions ("
    + missed.map(function(c){ return c.title; }).join(", ") + ").");
  CONCERNS.forEach(function(k){
    var found = S.concerns.filter(function(c){ return c.id === k.id; });
    if (!found.length) return;
    parts.push(k.label + ": " + found.slice(0, 3).map(function(c){ return c.source + " (“" + c.excerpt + "”)"; }).join("; ")
      + (found.length > 3 ? ", and " + (found.length - 3) + " more" : "") + ".");
  });
  if (S.meters.awareness <= 3){
    var lows = S.choices.filter(function(c){ return c.awareness < 0; }).map(function(c){ return "Day " + c.day + ": " + c.chosen.replace(/\.$/, ""); });
    parts.push("Low safety awareness (" + S.meters.awareness + "/10)" + (lows.length ? ": " + lows.slice(0, 3).join("; ") : "") + ".");
  }
  var checks = answerChecks();
  if (checks.length) parts.push("Answers to check: " + checks.join("; ") + ".");
  return parts.join(" ");
}

function profileType(){
  if (hasSeriousConcern()) return "transactional_guest"; /* excluded from automatic matching; staff read why */
  var m = S.meters;
  if (m.connection <= 3 && m.respect <= 3) return "transactional_guest";
  if (m.connection >= 7 && m.respect >= 7) return "connector";
  if (m.reliability >= 7 && m.connection <= 5) return "independent_tenant";
  return "considerate_companion";
}
function setPath(obj, path, value){
  var keys = path.split("."), o = obj;
  for (var i = 0; i < keys.length - 1; i++){ o[keys[i]] = o[keys[i]] || {}; o = o[keys[i]]; }
  o[keys[keys.length - 1]] = value;
}
/* Days keep their full-fortnight numbers (see DAYS), so the template's
   landmark rows and path grid line up. */
function screeningPart(){
  var low = findLowestMoment();
  var after = low ? S.choices.filter(function(c){ return c.day > low.day; }).reduce(function(n, c){ return n + choiceScore(c); }, 0) : 0;
  return {
    profile: profileType(),
    meters: {connection: S.meters.connection, respect: S.meters.respect, reliability: S.meters.reliability, awareness: S.meters.awareness},
    motivation: MOTIVATION_CODES[S.motivation] || null,
    finalPath: pathTier(),
    pathByDay: DAYS.map(function(d){ return {day: d.n, path: S.pathByDay[String(d.n)] || null}; }),
    recovered: low ? after > 0 : null,
    lowestMoment: low ? {day: low.day, note: low.note} : null,
    flags: ["quick_demo"].concat(Object.keys(S.flags).filter(function(k){ return S.flags[k]; }))
      .concat(CONCERNS.filter(function(k){ return S.concerns.some(function(c){ return c.id === k.id; }); }).map(function(k){ return k.id; }))
      .concat(S.meters.awareness <= 3 ? ["low_safety_awareness"] : [])
      .concat(answerChecks().length ? ["answers_to_check"] : [])
      .concat(S.choices.some(function(c){ return c.timedOut; }) ? ["missed_timer"] : []),
    watchPoint: autoWatchPoint(),
    landmarks: [6, 9, 11, 14].map(function(day){
      var made = S.choices.filter(function(c){ return c.day === day; });
      return {day: day, response: made.map(function(c){ return c.chosen; }).join(" · "), tags: made.map(function(c){ return c.tag; })};
    }).filter(function(x){ return x.response; })
  };
}
function buildProfile(){
  var names = S.name.trim().split(/\s+/);
  var p = {
    meta: {profileId: S.pid, updatedAt: (S.submittedAt || S.gameEndedAt || nowISO()).slice(0, 10),
           stages: {preGame: true, game: !!S.gameEndedAt, postGame: !!S.submittedAt}},
    student: {firstName: names[0], lastName: names.slice(1).join(" ") || null, email: S.email, discipline: S.studyArea}
  };
  Q_FIELDS.forEach(function(f){
    var v = qValue(f);
    if (v === undefined) return;
    if (f.sets) Object.keys(f.sets[v] || {}).forEach(function(path){ setPath(p, path, f.sets[v][path]); });
    else setPath(p, f.path, v);
  });
  if (S.studyArea !== "other" && S.q.fieldMentor !== "no") setPath(p, "interests.homeownerBackground", "Retired " + discipline().career.replace(/^an? /, ""));
  if (S.gameEndedAt) p.screening = screeningPart();
  return p;
}

/* ---------- storage: the artifact's record store, behind access rules ----------
   profiles/<account id>             the account's latest profile (staff read all; each account writes only its own)
   profiles/<account id>/runs/<run>  every run, with its fictional match. On market day the stand's tablets
                                     share one signed-in account, so each run is a different participant
   reviews/<run>                     staff-only: pairing status, homeowner, checks, watch-point */
function getCap(name){
  try {
    if (!window.claude || typeof window.claude.use !== "function") return Promise.resolve(null);
    return window.claude.use(name).then(function(v){ return v || null; }, function(){ return null; });
  } catch (e) { return Promise.resolve(null); }
}
function setStatus(id, cls, text){
  var n = document.getElementById(id);
  if (n) n.innerHTML = '<span class="dotled ' + cls + '"></span><span>' + esc(text) + '</span>';
}
var ATTENTION_FLAGS = ["threatening_language", "drug_references", "welfare_concern", "low_safety_awareness"];
function indexFields(profile, extra){
  var sc = profile.screening || {}, st = profile.student || {};
  return Object.assign({
    name: [st.firstName, st.lastName].filter(Boolean).join(" "), email: st.email || "", discipline: st.discipline || "",
    pid: (profile.meta || {}).profileId || "", screeningProfile: sc.profile || null,
    complete: !!((profile.meta || {}).stages || {}).postGame, profile: profile,
    attention: (sc.flags || []).filter(function(f){ return ATTENTION_FLAGS.indexOf(f) !== -1; }).length
  }, extra);
}

var syncChain = Promise.resolve();
function syncProfile(){
  var snap = {pid: S.pid, at: nowISO(), profile: buildProfile(), demoMatch: S.demoMatch || null};
  var attempt = function(){
    return writeProfile(snap).then(function(r){
      if (r.ok || (r.code !== "unavailable" && r.code !== "resource_exhausted")) return r;
      return new Promise(function(done){ setTimeout(done, 1200 + Math.random() * 1200); }).then(function(){ return writeProfile(snap); });
    });
  };
  syncChain = syncChain.then(attempt, attempt);
  return syncChain;
}
/* Resolves {ok} or {ok:false, reason, code}; never rejects. */
function writeProfile(snap){
  return Promise.all([getCap("db"), getCap("user")]).then(function(caps){
    var db = caps[0], user = caps[1];
    if (!db || !user) return {ok: false, reason: "no_store"};
    return user.id().then(function(uid){
      if (!uid) return {ok: false, reason: "no_store"};
      var parent = db.doc("profiles/" + uid);
      var complete = !!snap.profile.meta.stages.postGame;
      /* No list of runs in the account document: one shared stand account would grow it without limit,
         and tablets writing at once would overwrite each other's lists. The desk reads the runs directly. */
      return parent.collection("runs").doc(snap.pid).set({pid: snap.pid, savedAt: snap.at, complete: complete, profile: snap.profile, demoMatch: snap.demoMatch})
        .then(function(){ return parent.set(indexFields(snap.profile, {updatedAt: snap.at, latestRun: snap.pid})); })
        .then(function(){ return {ok: true}; });
    });
  }).then(null, function(err){ return {ok: false, reason: "error", code: (err && err.code) || "unavailable"}; });
}
/* What went wrong, in words the applicant can act on. */
function saveProblem(r, dbState){
  if (dbState === "denied" || r.code === "not_granted" || r.code === "revoked")
    return {text: "Saving to the placement service is switched off for this page. Press Permissions, turn it on, then press Try again.", perms: true};
  if (r.reason === "no_store")
    return {text: "This view can’t reach the placement service. Open the link at claude.ai in your web browser, signed in to your organisation, then press Try again. Or send your profile another way below."};
  if (r.code === "quota_exceeded") return {text: "The placement record is full, so your profile couldn’t be saved. Send it another way below."};
  if (r.code === "invalid_argument")
    return {text: "The placement service refused the save. Your account may only have permission to view this page: ask the service for Contributor access, or send your profile another way below."};
  return {text: "Your profile couldn’t be sent (" + (r.code || "unknown error") + "). Wait a moment and press Try again, or send it another way below."};
}

/* onFail runs when no file could be saved (not when the viewer cancels). */
function offerDownload(filename, text, statusId, onFail){
  getCap("downloads").then(function(d){
    if (!d && !window.claude){ browserDownload(filename, text); setStatus(statusId, "ok", "Saved " + filename + ". Check your downloads folder."); return; }
    if (!d){ setStatus(statusId, "no", "Downloads aren’t available in this view."); if (onFail) onFail(); return; }
    setStatus(statusId, "wait", "Confirm the download to save the file…");
    d.save({filename: filename, data: text}).then(function(){
      setStatus(statusId, "ok", "Saved " + filename + ". Check your downloads folder.");
    }, function(err){
      var code = (err && err.code) || "unavailable";
      if (code === "declined") { setStatus(statusId, "wait", "Download cancelled. Nothing was saved."); return; }
      setStatus(statusId, "no", "The download didn’t work (" + code + ").");
      if (onFail) onFail();
    });
  });
}
/* Outside claude.ai (a local copy of the page) the browser can download directly. */
function browserDownload(filename, data){
  var type = /\.pdf$/.test(filename) ? "application/pdf" : /\.csv$/.test(filename) ? "text/csv" : "application/json";
  var url = URL.createObjectURL(new Blob([data], {type: type}));
  var a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
}
function copyText(text, statusId, onFail){
  var fail = function(){ setStatus(statusId, "no", "Copying isn’t allowed in this view."); if (onFail) onFail(); };
  try {
    navigator.clipboard.writeText(text).then(function(){ setStatus(statusId, "ok", "Copied. Paste it into an email to the placement service."); }, fail);
  } catch (e) { fail(); }
}

function deliverProfile(){

    } else {
      save();
      getCap("permissions").then(function(p){ return p ? p.state("db").then(null, function(){ return ""; }) : ""; }).then(function(dbState){
