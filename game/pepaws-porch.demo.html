/* ---------- the market-day pairing: a fictional homeowner ----------
   Each participant is matched with the best of the fictional hosts in
   genstay-hosts.sample.json, published beside this page, by the same
   matching the staff desk uses (genstay-matching.js). Everyone gets
   their own best match: hosts aren't used up. The pairing is saved with
   the run, so the staff desk's live board shows what the participant saw. */
var DEMO_HOSTS_URL = "genstay-hosts.sample.json";
var demoHostsLoading = null;
function loadDemoHosts(){
  if (!demoHostsLoading) demoHostsLoading = fetch(DEMO_HOSTS_URL)
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function(text){ return loadMatcher().then(function(M){
      if (!M) return null;
      var generated = null;
      try { generated = JSON.parse(text).generated; } catch (e) { /* a host list without a date keeps its dates */ }
      return freshDates(M.parseHosts(text).hosts, generated);
    }); })
    .then(null, function(){ demoHostsLoading = null; return null; });
  return demoHostsLoading;
}
/* The sample rooms come free a few months after the file was written
   ("generated"). On a later market day every date moves forward by the
   months since, so the rooms are still coming free when people play. */
function freshDates(hosts, generated){
  var from = /^(\d{4})-(\d{2})/.exec(generated || ""), now = new Date();
  var months = from ? (now.getFullYear() - +from[1]) * 12 + now.getMonth() + 1 - +from[2] : 0;
  if (months > 0) hosts.forEach(function(h){
    var pl = h.placement || {}, m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(pl.availableFrom || "");
    if (!m) return;
    var d = new Date(+m[1], +m[2] - 1 + months, +m[3]);
    pl.availableFrom = d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
  });
  return hosts;
}
function prepareMatch(){ loadDemoHosts(); }
/* Resolves the match summary, or null if the hosts or the matcher couldn't load in time. */
function findDemoMatch(){
  var late = new Promise(function(done){ setTimeout(function(){ done(null); }, 6000); });
  return Promise.race([loadDemoHosts(), late]).then(function(hosts){
    var M = window.GenStayMatch;
    var best = M && hosts && hosts.length ? M.bestMatch({id: S.pid, name: S.name, profile: buildProfile()}, hosts) : null;
    if (!best) return null;
    return matchSummary(best);
  }, function(){ return null; });
}
function capFirst(t){ t = String(t || ""); return t.charAt(0).toUpperCase() + t.slice(1); }
/* The note under the profile type. A run screened out by an unsafe answer isn't told there's no pass or fail. */
function resultNote(){
  return (outcomeOf(S.demoMatch) === "screened_out"
    ? "Most of the game is a reflection on the path you took, but the choices above rule a placement out on their own."
    : "This is a reflection on the path you took, not a pass-or-fail result.")
    + " It comes from the quick demo; the full screening is fourteen days with written answers. A person at the placement service makes any placement decision.";
}
/* The participant's outcome: their homeowner; shortlisted and waiting for a
   suitable host (no match strong enough yet); or no placement, when an answer
   in the game rules one out. */
function drawMatchCard(){
  var box = el("#matchcard");
  if (!box) return;
  var m = S.demoMatch, o = outcomeOf(m);
  if (el("#resultnote")) el("#resultnote").textContent = resultNote();
  if (S.matchPending){ box.innerHTML = '<div class="matchcard"><div class="mc-kicker">Your demo match</div><p class="sub">Finding your homeowner…</p></div>'; return; }
  if (!m){ box.innerHTML = ""; return; }
  if (o === "screened_out"){
    box.innerHTML = '<div class="matchcard mc-out"><div class="mc-kicker">No placement this time</div>'
      + '<div class="mc-name">We can’t offer you a homeowner from this run</div>'
      + '<p class="mc-talk">Safety comes first in a homeshare, and some choices rule a placement out on their own.</p>'
      + '<ul class="mc-list">' + (m.reasons || []).map(function(t){ return '<li>' + esc(t) + '</li>'; }).join("") + '</ul>'
      + '<p class="mc-note">In a real application, a coordinator would talk this through with you. You’re welcome to play again.</p></div>';
    return;
  }
  if (o === "waiting"){
    var bar = m.minScore || 65;
    box.innerHTML = '<div class="matchcard mc-wait"><div class="mc-kicker">Shortlisted</div>'
      + '<div class="mc-name">Waiting for a suitable host</div>'
      + '<p class="mc-talk">You’re on our shortlist, but none of our current homeowners is a strong enough match for you yet. '
      + (m.closest ? esc("None passes every check" + (m.standsInWay && m.standsInWay[0] ? " (for the closest, " + m.standsInWay[0] + ")" : "") + ".")
          : esc("Your closest scored " + m.score + ", and we only place pairings of " + bar + " or more.")) + '</p>'
      + (!m.closest && m.shortfall && m.shortfall.length ? '<p class="mc-talk"><b>What held it back:</b> ' + esc(m.shortfall.join(" and ")) + '.</p>' : '')
      + '<p class="mc-note">In a real placement, we’d match you when the right homeowner joins. We only place pairings that suit both people.</p></div>';
    return;
  }
  var initials = m.hostName.split(/\s+/).filter(function(w){ return w !== "and"; });
  initials = (initials[0] || "").charAt(0) + (initials.length > 1 ? initials[initials.length - 1].charAt(0) : "");
  var couple = m.first.indexOf(" and ") !== -1;
  box.innerHTML = '<div class="matchcard">'
    + '<div class="mc-kicker">Your demo match</div>'
    + '<div class="mc-head"><div class="mc-avatar" aria-hidden="true">' + esc(initials) + '</div>'
    + '<div class="mc-who"><div class="mc-name">' + esc(m.first) + (m.age ? ", " + m.age + (m.partnerAge ? " and " + m.partnerAge : "") : "") + '</div>'
    + '<div class="mc-sub">' + esc([m.suburb, m.career].filter(Boolean).join(" · ")) + '</div></div>'
    + '<div class="mc-score" title="How well this pairing suits you both, out of 100"><b>' + m.score + '</b><span>match</span></div></div>'
    + (m.highlights.length ? '<ul class="mc-why">' + m.highlights.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join("") + '</ul>' : '')
    + (m.talkAbout.length ? '<p class="mc-talk"><b>Good to know:</b> ' + esc(capFirst(m.talkAbout.join("; "))) + '.</p>' : '')
    + '<p class="mc-note">' + esc(m.first) + (couple ? " are" : " is") + ' made up for this demo. Real pairings are always made by people at the placement service.</p>'
    + '</div>';
}
</script>
<script>
"use strict";
/* ============================================================
   STAFF REVIEW DESK  (open the artifact link with #staff)
   A queue of every applicant's matching profile, newest first.
   Each one opens in the GenStay profile template, published
   alongside this page, and staff step through them in order.
   Access is enforced by the record store's rules, not by this
   page: only Editors and the owner can read profiles or reviews.
   ============================================================ */
var TEMPLATE_URL = "genstay-profile-template.html";
var PAIRING = [["new","New applicant"],["screening","In screening"],["shortlisted","Shortlisted"],["intro_booked","Intro call booked"],
               ["matched","Matched"],["on_hold","On hold"],["not_suitable","Not suitable"]];
var CHECKS = [["identity","ID"],["policeCheck","Police check"],["references","References"],["firstAid","First aid"]];
var CHECK_STATES = [["","—"],["not_started","Not started"],["pending","Pending"],["booked","Booked"],["cleared","Cleared"],["not_required","Not required"]];

var desk = null;
function label(pairs, v){ var m = pairs.filter(function(p){ return p[0] === v; })[0]; return m ? m[1] : v; }
function cleanId(s){ return String(s || "").replace(/[^A-Za-z0-9_.~:@+-]/g, "-").slice(0, 120) || ("x" + Date.now()); }
function deepMerge(target, src){
  Object.keys(src || {}).forEach(function(k){
    var v = src[k];
    if (v === undefined || v === null || v === "") return;
    if (v && typeof v === "object" && !Array.isArray(v) && target[k] && typeof target[k] === "object" && !Array.isArray(target[k])) deepMerge(target[k], v);
    else target[k] = v;
  });
  return target;
}
/* Staff fields: the saved review, else what the profile itself carries (an imported file may already have them). */
function reviewFor(item){
  var r = desk.reviews[item.id] || {}, p = item.profile || {}, meta = p.meta || {};
  return {pairingStatus: r.pairingStatus || meta.pairingStatus || "new", suggestedFor: r.suggestedFor || meta.suggestedFor || "",
          checks: r.checks || p.checks || {}, watchPoint: r.watchPoint || (p.screening || {}).watchPoint || "", reviewedAt: r.reviewedAt};
}
/* staff fields live in reviews/<id> and are laid over the applicant's profile */
function mergedProfile(item, profile){
  var r = reviewFor(item);
  return deepMerge(JSON.parse(JSON.stringify(profile || item.profile || {})), {
    meta: {pairingStatus: r.pairingStatus, suggestedFor: r.suggestedFor, updatedAt: (r.reviewedAt || item.updatedAt || "").slice(0, 10)},
    checks: r.checks,
    screening: {watchPoint: r.watchPoint}
  });
}

function renderStaff(){
  stopLive();
  app.className = "wide";
  desk = {db: null, user: null, uid: null, items: [], reviews: {}, filter: "all", search: "", current: null, frame: null, ready: false, pending: null,
          hosts: [], match: null, hostSel: null, tab: "app", live: [], byAccount: {}, stamps: {}, reads: {}, loaded: {}};
  app.innerHTML =
    '<div class="topbar"><div class="toprow"><span class="daylabel">Pepaws Porch demo · staff review</span>'
    + '<span class="clock" id="acount">loading…</span></div>' + tabsHTML() + '</div>'
    + '<div class="desk" id="deskapp" role="tabpanel" aria-labelledby="tab-app">'
    + '<div class="queue"><div class="qtools">'
    + '<input type="text" id="qsearch" placeholder="Search by name or email" aria-label="Search applicants">'
    + '<select id="qfilter" aria-label="Filter by pairing status"><option value="all">All applicants</option><option value="attention">Needs attention</option>'
    + PAIRING.map(function(p){ return '<option value="' + p[0] + '">' + p[1] + '</option>'; }).join("") + '</select>'
    + '<div class="btnrow"><button class="cont small" id="refresh">Refresh</button>'
    + '<label class="cont ghost small" style="display:inline-flex;flex-direction:row;cursor:pointer">Add profile files<input type="file" id="importer" accept=".json,application/json" multiple hidden></label>'
    + '<button class="cont ghost small" id="pastebtn">Paste a profile</button>'
    + '<button class="cont ghost small" id="pdfall">Download all (PDF)</button>'
    + '<button class="cont ghost small" id="expall">Download all (JSON)</button></div>'
    + '<div id="pastebox" hidden style="display:flex;flex-direction:column;gap:6px"><textarea id="pastein" aria-label="Paste a profile" placeholder="Paste the profile text an applicant emailed you" style="min-height:110px;font:400 12px/1.4 var(--mono)"></textarea>'
    + '<div class="btnrow"><button class="cont primary small" id="pasteadd">Add to queue</button><button class="cont ghost small" id="pastecancel">Cancel</button></div></div>'
    + '<div class="status" id="astat"><span class="dotled wait"></span><span>Reading the placement record…</span></div>'
    + '</div><ul class="qlist" id="qlist"></ul></div>'
    + '<div class="viewer"><div class="vbar">'
    + '<button class="cont small" id="prev" aria-label="Previous applicant">‹ Prev</button><button class="cont small" id="next" aria-label="Next applicant">Next ›</button>'
    + '<b class="grow" id="vname">No profile open</b>'
    + '<button class="cont small" id="pdfone" disabled>Download PDF</button>'
    + '<button class="cont ghost small" id="dlone" disabled>Download JSON</button>'
    + '<span class="status" id="fstat"></span></div>'
    + '<div class="vbody"><iframe id="pframe" title="GenStay matching profile" src="' + TEMPLATE_URL + '?embed"></iframe>'
    + '<aside class="review" id="review"><div class="empty-state">Pick an applicant from the queue to review their profile.</div></aside></div>'
    + '</div></div>' + hostDeskHTML();

  desk.frame = el("#pframe");
  setTimeout(function(){ if (desk && !desk.ready) frameFallback(); }, 5000);
  el("#refresh").onclick = function(){ loadQueue(); loadHosts(); };
  el("#qsearch").oninput = function(){ desk.search = this.value.trim().toLowerCase(); drawQueue(); };
  el("#qfilter").onchange = function(){ desk.filter = this.value; drawQueue(); };
  el("#prev").onclick = function(){ step(-1); };
  el("#next").onclick = function(){ step(1); };
  el("#importer").onchange = function(){ importFiles(this.files); this.value = ""; };
  el("#pastebtn").onclick = function(){ el("#pastebox").hidden = false; el("#pastein").focus(); };
  el("#pastecancel").onclick = function(){ el("#pastebox").hidden = true; el("#pastein").value = ""; };
  el("#pasteadd").onclick = function(){
    var text = el("#pastein").value.trim(); if (!text) return;
    importTexts([text]); el("#pastein").value = ""; el("#pastebox").hidden = true;
  };
  el("#expall").onclick = function(){
    if (!desk.items.length){ setStatus("astat", "wait", "Nothing to export yet."); return; }
    offerDownload("genstay-profiles-" + nowISO().slice(0, 10) + ".json",
      JSON.stringify(desk.items.map(function(it){ return mergedProfile(it); }), null, 2), "astat");
  };
  el("#pdfone").onclick = function(){
    var it = currentItem(); if (!it) return;
    makePdfFile([mergedProfile(it)], "genstay-profile-" + cleanId(it.name || it.id).toLowerCase() + ".pdf", "fstat");
  };
  el("#pdfall").onclick = function(){
    var list = visibleItems();
    if (!list.length){ setStatus("astat", "wait", "Nothing to export yet."); return; }
    makePdfFile(list.map(function(it){ return mergedProfile(it); }), "genstay-profiles-" + nowISO().slice(0, 10) + ".pdf", "astat");
  };
  el("#dlone").onclick = function(){
    var it = currentItem(); if (!it) return;
    var p = mergedProfile(it);
    offerDownload("genstay-profile-" + cleanId(it.name || it.id).toLowerCase() + ".json", JSON.stringify(p, null, 2), "fstat");
  };
  bindHostDesk();
  Promise.all([getCap("db"), getCap("user")]).then(function(caps){
    desk.db = caps[0]; desk.user = caps[1];
    if (!desk.user){ loadHosts(); return loadQueue(); }
    return Promise.all([desk.user.canEdit(), desk.user.id()]).then(function(r){
      desk.uid = r[1];
      if (!r[0]){
        desk.db = null;
        setStatus("astat", "no", "This page is for placement staff. Ask the owner of this artifact to give you Editor access.");
        setStatus("hstat", "no", "Host profiles are for placement staff only.");
        el("#acount").textContent = "staff only";
        return;
      }
      loadQueue();
      loadHosts();
    });
  });
}

/* ---------- the profile template, embedded ---------- */
window.addEventListener("message", function(e){
  if (!desk) return;
  var m = e.data || {};
  if (desk.xframe && e.source === desk.xframe.contentWindow){
    var job = pdfJobs[m.id];
    if (m.type === "genstay:ready" && desk.xresolve) desk.xresolve(desk.xframe);
    else if (m.type === "genstay:pdf:progress" && job) job.progress(m.done, m.total);
    else if (m.type === "genstay:pdf:done" && job){ delete pdfJobs[m.id]; if (m.ok) job.resolve(m.data); else job.reject(new Error(m.error)); }
    return;
  }
  if (!desk.frame || e.source !== desk.frame.contentWindow) return;
  if (m.type === "genstay:ready"){ desk.ready = true; if (desk.pending) sendToFrame(desk.pending); }
  else if (m.type === "genstay:ack" && m.status) setStatus("fstat", "ok", m.status.filled + " of " + m.status.total + " fields filled");
});
function frameTarget(){ return location.origin && location.origin !== "null" ? location.origin : "*"; }
function sendToFrame(profile){
  desk.pending = profile;
  if (!desk.ready || !desk.frame.contentWindow) return;
  desk.frame.contentWindow.postMessage({type: "genstay:profile", mode: "load", data: profile}, frameTarget());
}
/* If the frame can't load the template by address, load its text instead. */
function frameFallback(){
  fetch(TEMPLATE_URL).then(function(r){ if (!r.ok) throw new Error(r.status); return r.text(); }).then(function(html){
    if (!desk) return;
    desk.frame.removeAttribute("src");
    desk.srcdoc = html.replace("<script>", "<script>window.GENSTAY_CONFIG={embedded:true};<\/script><script>");
    desk.frame.srcdoc = desk.srcdoc;
  }).catch(function(){ setStatus("fstat", "no", "The profile template didn’t load. It must be published next to this page."); });
}

/* ---------- PDFs ----------
   The template makes them (it knows its own layout and where pages can
   break), in a hidden copy of the frame so the profile on screen stays put. */
var pdfJobs = {};
function exportFrame(){
  if (desk.xready) return desk.xready;
  desk.xready = new Promise(function(resolve, reject){
    var f = document.createElement("iframe");
    f.title = "PDF export"; f.tabIndex = -1; f.setAttribute("aria-hidden", "true");
    f.style.cssText = "position:fixed;left:-12000px;top:0;width:900px;height:1400px;border:0;pointer-events:none";
    desk.xframe = f; desk.xresolve = resolve;
    if (desk.srcdoc) f.srcdoc = desk.srcdoc; else f.src = TEMPLATE_URL + "?embed";
    app.appendChild(f);
    setTimeout(function(){ reject(new Error("The profile template didn’t load, so the PDF couldn’t be made.")); }, 15000);
  });
  desk.xready.then(null, function(){ if (desk.xframe) desk.xframe.remove(); desk.xframe = null; desk.xready = null; });
  return desk.xready;
}
function frameView(){
  try { return desk.frame.contentDocument.body.getAttribute("data-view") || "staff"; } catch (e) { return "staff"; }
}
function requestPdf(profiles, view, onProgress){
  return exportFrame().then(function(f){
    return new Promise(function(resolve, reject){
      var id = "pdf-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      pdfJobs[id] = {resolve: resolve, reject: reject, progress: onProgress || function(){}};
      f.contentWindow.postMessage({type: "genstay:pdf", id: id, profiles: profiles, view: view}, frameTarget());
    });
  });
}
function makePdfFile(profiles, filename, statusId){
  var buttons = [el("#pdfone"), el("#pdfall")];
  desk.pdfBusy = true;
  buttons.forEach(function(b){ if (b) b.disabled = true; });
  setStatus(statusId, "wait", "Making the PDF…");
  requestPdf(profiles, frameView(), function(done, total){
    if (total > 1) setStatus(statusId, "wait", "Making the PDF: " + done + " of " + total + " profiles…");
  }).then(function(buf){ offerDownload(filename, buf, statusId); }, function(err){
    /* Usually no internet for the PDF tools. Outside claude.ai the browser can still print the open profile to PDF. */
    if (!window.claude && desk.frame && desk.frame.contentWindow){
      try {
        desk.frame.contentWindow.print();
        setStatus(statusId, "wait", "The PDF tools didn’t load, so the print dialog opened instead. Choose Save as PDF. It saves the profile on screen.");
        return;
      } catch (e) { /* fall through to the message */ }
    }
    setStatus(statusId, "no", err.message || "The PDF couldn’t be made.");
  }).then(function(){
    if (!desk) return;
    desk.pdfBusy = false;
    if (el("#pdfall")) el("#pdfall").disabled = false;
    if (el("#pdfone")) el("#pdfone").disabled = !currentItem();
  });
}

/* ---------- queue: live from the record store ---------- */
function loadQueue(openId){
  if (!desk.db){
    setStatus("astat", "wait", "The placement record isn’t available in this view. Profile files you add are shown here but not saved.");
    el("#acount").textContent = desk.items.length + " in queue";
    drawQueue();
    refreshMatches();
    if (openId) openItem(openId);
    return Promise.resolve();
  }
  stopQueue();
  desk.byAccount = {}; desk.stamps = {}; desk.openId = openId || null; desk.loaded = {};
  setStatus("astat", "wait", "Reading the placement record…");
  var lost = function(err){ setStatus("astat", "no", "Lost the live link to the placement record (" + ((err && err.code) || "unavailable") + "). Press Refresh."); };
  desk.live.push(desk.db.collection("profiles").limit(1000).onSnapshot(function(snap){
    if (!desk) return;
    var seen = {};
    snap.docs.forEach(function(d){
      var data = d.data() || {};
      seen[d.id] = 1;
      if (data.imported){ desk.byAccount[d.id] = data.profile ? [Object.assign({id: d.id}, data)] : []; return; }
      /* every save touches the account's index doc, so a changed stamp means new or changed runs */
      var stamp = (data.updatedAt || "") + "|" + (data.latestRun || "");
      if (desk.stamps[d.id] !== stamp){ desk.stamps[d.id] = stamp; readRuns(d.id, lost); }
    });
    Object.keys(desk.byAccount).forEach(function(id){
      if (!seen[id]){ delete desk.byAccount[id]; delete desk.stamps[id]; }
    });
    desk.loaded.profiles = true;
    queueChanged();
  }, lost));
  desk.live.push(desk.db.collection("reviews").limit(1000).onSnapshot(function(snap){
    if (!desk) return;
    desk.reviews = {};
    snap.docs.forEach(function(d){ desk.reviews[d.id] = d.data(); });
    desk.loaded.reviews = true;
    queueChanged();
  }, lost));
  return Promise.resolve();
}
/* Every run on an account is a participant of its own: on market day the
   stand's tablets share one signed-in account. */
function readRuns(account, lost){
  var d0 = desk, ticket = (desk.reads[account] || 0) + 1;
  desk.reads[account] = ticket;
  desk.byAccount[account] = desk.byAccount[account] || [];
  desk.db.collection("profiles/" + account + "/runs").orderBy("savedAt", "desc").limit(1000).get().then(function(snap){
    if (desk !== d0 || desk.reads[account] !== ticket || !desk.stamps[account]) return;
    desk.byAccount[account] = snap.docs.map(function(d){
      var r = d.data() || {};
      return r.profile ? indexFields(r.profile, {id: d.id, account: account, updatedAt: r.savedAt, complete: !!r.complete, demoMatch: r.demoMatch || null}) : null;
    }).filter(Boolean);
    queueChanged();
  }, lost);
}
/* Redraws after any live change, keeping the open profile open. */
function queueChanged(){
  if (!desk || !desk.loaded.profiles || !desk.loaded.reviews) return;
  desk.items = [].concat.apply([], Object.keys(desk.byAccount).map(function(k){ return desk.byAccount[k]; }))
    .sort(function(a, b){ return String(b.updatedAt || "").localeCompare(String(a.updatedAt || "")); });
  setStatus("astat", "ok", count(desk.items.length, "profile") + ". New ones appear here as people finish.");
  drawQueue();
  refreshMatches();
  var target = desk.openId && itemById(desk.openId) ? desk.openId : !desk.current && visibleItems().length ? visibleItems()[0].id : null;
  if (target){ desk.openId = null; openItem(target); }
}
function stopQueue(){
  (desk.live || []).forEach(function(stop){ stop(); });
  desk.live = [];
}
function stopLive(){
  if (!desk) return;
  stopQueue();
  if (desk.hostsLive){ desk.hostsLive(); desk.hostsLive = null; }
  clearInterval(desk.boardTick);
}
function visibleItems(){
  return desk.items.filter(function(it){
    var status = reviewFor(it).pairingStatus;
    if (desk.filter === "attention") { if (!it.attention) return false; }
    else if (desk.filter !== "all" && status !== desk.filter) return false;
    return !desk.search || ((it.name || "") + " " + (it.email || "")).toLowerCase().indexOf(desk.search) !== -1;
  });
}
function currentItem(){ return desk.items.filter(function(it){ return it.id === desk.current; })[0] || null; }
function drawQueue(){
  var list = visibleItems();
  el("#acount").textContent = list.length + " of " + desk.items.length + " in queue";
  el("#qlist").innerHTML = list.length ? list.map(function(it){
    var r = reviewFor(it), type = PROFILE_TYPES[it.screeningProfile];
    return '<li><button class="qitem" data-id="' + esc(it.id) + '" aria-current="' + (it.id === desk.current) + '">'
      + '<span class="nm">' + esc(it.name || "Unnamed applicant") + '</span>'
      + '<span class="when">' + esc((it.updatedAt || "").slice(0, 10)) + '</span>'
      + '<span class="meta">'
      + (type ? '<span class="pill dark" style="background:' + type.colour + '">' + esc(type.title.replace(/^The /, "")) + '</span>' : '<span class="pill">No game result</span>')
      + (it.attention ? '<span class="pill dark" style="background:var(--bad)">Needs attention</span>' : '')
      + '<span class="pill">' + esc(label(PAIRING, r.pairingStatus)) + '</span>'
      + (it.complete ? '' : '<span class="pill">Questions unfinished</span>')
      + (it.imported ? '<span class="pill">From file</span>' : '')
      + (/^DEMO-/.test(it.pid || "") ? '<span class="pill">Quick demo</span>' : '')
      + (it.demoMatch ? '<span class="pill">' + esc(outcomeLabel(it.demoMatch)) + '</span>' : '')
      + '</span></button></li>';
  }).join("") : '<li class="empty-state">' + (desk.items.length ? "No applicants match this filter." : "No profiles yet. They appear here when applicants finish the demo, or when you add profile files.") + '</li>';
  Array.prototype.forEach.call(app.querySelectorAll(".qitem"), function(b){ b.onclick = function(){ openItem(b.getAttribute("data-id")); }; });
}
function step(dir){
  var list = visibleItems();
  if (!list.length) return;
  var at = list.map(function(it){ return it.id; }).indexOf(desk.current);
  openItem(list[(at + dir + list.length) % list.length].id);
}

/* ---------- one applicant ---------- */
function openItem(id){
  desk.current = id;
  var it = currentItem(); if (!it) return;
  drawQueue();
  el("#vname").textContent = it.name || "Unnamed applicant";
  el("#dlone").disabled = false;
  el("#pdfone").disabled = !!desk.pdfBusy;
  setStatus("fstat", "wait", "Opening profile…");
  sendToFrame(mergedProfile(it));
  drawReview(it);
}
function drawReview(it){
  var r = reviewFor(it), checks = r.checks;
  var opts = function(pairs, v){ return pairs.map(function(p){ return '<option value="' + p[0] + '"' + (p[0] === (v || "") ? " selected" : "") + '>' + p[1] + '</option>'; }).join(""); };
  el("#review").innerHTML = '<h3>Staff review</h3>'
    + '<p class="sub" style="font-size:12.5px">Saved separately from the applicant’s answers, and shown in the profile.</p>'
    + '<label>Pairing status<select id="rv-status">' + opts(PAIRING, r.pairingStatus) + '</select></label>'
    + '<label>Suggested homeowner<input type="text" id="rv-for" maxlength="120" value="' + esc(r.suggestedFor) + '" placeholder="e.g. Margaret Hollis"></label>'
    + '<div class="bestfor" id="rv-best"></div>'
    + CHECKS.map(function(c){ return '<label>' + c[1] + '<select id="rv-' + c[0] + '">' + opts(CHECK_STATES, checks[c[0]]) + '</select></label>'; }).join("")
    + '<label>Watch-point<textarea id="rv-watch" maxlength="2000" placeholder="e.g. Reliability is the lowest meter. Agree a weekly help schedule at the intro call.">' + esc(r.watchPoint) + '</textarea></label>'
    + '<button class="cont primary small" id="rv-save">Save review</button>'
    + '<div class="status" id="rvstat"></div>';
  el("#rv-save").onclick = function(){ saveReview(it); };
  drawBestHosts(it);
}
function saveReview(it){
  var review = {pairingStatus: el("#rv-status").value, suggestedFor: el("#rv-for").value.trim(), watchPoint: el("#rv-watch").value.trim(),
                checks: {}, reviewedAt: nowISO(), reviewedBy: desk.uid || null};
  CHECKS.forEach(function(c){ var v = el("#rv-" + c[0]).value; if (v) review.checks[c[0]] = v; });
  review.suggestedHostId = hostIdFor(review.suggestedFor, it);
  var done = function(){
    desk.reviews[it.id] = review;
    drawQueue();
    refreshMatches();
    sendToFrame(mergedProfile(it));
  };
  if (!desk.db){ done(); setStatus("rvstat", "wait", "Shown here only. The placement record isn’t available in this view."); return; }
  setStatus("rvstat", "wait", "Saving…");
  desk.db.doc("reviews/" + it.id).set(review).then(function(){ done(); setStatus("rvstat", "ok", "Saved."); },
    function(err){ setStatus("rvstat", "no", "Couldn’t save (" + ((err && err.code) || "unavailable") + ")."); });
}

/* ---------- profile files emailed in by applicants who couldn't save ---------- */
function importFiles(files){
  var list = Array.prototype.slice.call(files || []);
  if (!list.length) return;
  Promise.all(list.map(function(f){ return f.text().then(null, function(){ return ""; }); })).then(importTexts);
}
function importTexts(texts){
  var profiles = [];
  texts.forEach(function(t){
    try {
      var v = JSON.parse(t);
      (Array.isArray(v) ? v : [v]).forEach(function(x){
        var p = x && x.profile ? x.profile : x;
        if (p && typeof p === "object" && (p.student || p.screening)) profiles.push(p);
      });
    } catch (e) { /* not JSON; reported below if nothing usable was found */ }
  });
  if (!profiles.length){ setStatus("astat", "no", "No profile found. Paste or add the whole profile text, starting with { and ending with }."); return; }
  var at = nowISO();
  var items = profiles.map(function(p){
    var pid = (p.meta && p.meta.profileId) || ("import-" + Date.now().toString(36));
    return indexFields(p, {id: "import-" + cleanId(pid), updatedAt: at, imported: true});
  });
  if (!desk.db){
    items.forEach(function(it){ desk.items = desk.items.filter(function(x){ return x.id !== it.id; }); desk.items.unshift(it); });
    loadQueue(items[0].id);
    return;
  }
  setStatus("astat", "wait", "Adding " + items.length + " profile" + (items.length === 1 ? "" : "s") + "…");
  items.reduce(function(chain, it){
    return chain.then(function(){ var body = Object.assign({}, it); delete body.id; return desk.db.doc("profiles/" + it.id).set(body); });
  }, Promise.resolve()).then(function(){ loadQueue(items[0].id); },
    function(err){ setStatus("astat", "no", "Couldn’t add the profiles (" + ((err && err.code) || "unavailable") + ")."); });
}
</script>
<script>
"use strict";
/* ============================================================
   HOSTS AND MATCHES  (the staff desk's second and third tabs)
   Host profiles, for the older people offering a room, come from
   JSON files (genstay-hosts.sample.json is the format) or the host
   spreadsheet (a saved CSV, or rows pasted from it). They're kept in
   hosts/<host id>, which only Editors and the owner can read.
   genstay-matching.js, published beside this page, judges every host
   and applicant from both sides whenever either changes, and suggests
   the best overall allocation with its reasons. Suggesting a pairing
   shortlists the applicant for that homeowner in their review, so it
   shows in their profile. Nobody is contacted.
   The live board shows each finished applicant with their best match:
   on market day, the fictional pairing the participant was shown.
   This block is the same in pepaws-porch.html and pepaws-porch.demo.html.
   ============================================================ */
var MATCHER_URL = "genstay-matching.js";
var MATCHER_MISSING = "The matching script (genstay-matching.js) didn’t load. It must be published next to this page.";
var BAND = {strong: ["Strong match", "var(--good)"], good: ["Good match", "var(--sage)"], possible: ["Possible match", "var(--warn)"], weak: ["Weak match", "var(--clay)"]};
var STAFF_PAIRED = ["shortlisted", "intro_booked", "matched"];
var matcherLoading = null;
function loadMatcher(){
  if (window.GenStayMatch) return Promise.resolve(window.GenStayMatch);
  if (!matcherLoading) matcherLoading = new Promise(function(resolve){
    var s = document.createElement("script");
    s.src = MATCHER_URL;
    s.onload = function(){ resolve(window.GenStayMatch || null); };
    s.onerror = function(){ matcherLoading = null; s.remove(); resolve(null); };
    document.head.appendChild(s);
  });
  return matcherLoading;
}

function tabsHTML(){
  return '<div class="tabs" role="tablist" aria-label="Staff desk">'
    + '<button class="tab" role="tab" id="tab-app" aria-controls="deskapp" aria-selected="true">Applicants</button>'
    + '<button class="tab" role="tab" id="tab-hosts" aria-controls="deskhosts" aria-selected="false">Hosts and matches</button>'
    + '<button class="tab" role="tab" id="tab-board" aria-controls="deskboard" aria-selected="false">Live board</button></div>';
}
function hostDeskHTML(){
  return '<div class="desk" id="deskhosts" role="tabpanel" aria-labelledby="tab-hosts" hidden>'
    + '<div class="queue"><div class="qtools">'
    + '<div class="btnrow"><label class="cont small" style="display:inline-flex;flex-direction:row;cursor:pointer">Add host files<input type="file" id="hostimporter" accept=".csv,.tsv,.txt,.json,text/csv,text/plain,application/json" multiple hidden></label>'
    + '<button class="cont ghost small" id="hostpastebtn">Paste hosts</button>'
    + '<button class="cont ghost small" id="hrefresh">Refresh</button></div>'
    + '<div class="btnrow"><button class="cont ghost small" id="hosttemplate">Host template (CSV)</button>'
    + '<button class="cont ghost small" id="hostexport">Download hosts (CSV)</button></div>'
    + '<div id="hostpastebox" hidden style="display:flex;flex-direction:column;gap:6px"><textarea id="hostpastein" aria-label="Paste hosts" placeholder="Paste rows copied from the host spreadsheet, heading row first, or host profile JSON" style="min-height:110px;font:400 12px/1.4 var(--mono)"></textarea>'
    + '<div class="btnrow"><button class="cont primary small" id="hostpasteadd">Add hosts</button><button class="cont ghost small" id="hostpastecancel">Cancel</button></div></div>'
    + '<div class="status" id="hstat"><span class="dotled wait"></span><span>Reading host profiles…</span></div>'
    + '</div><ul class="qlist" id="hlist"></ul></div>'
    + '<div class="viewer"><div class="vbar"><b class="grow" id="hname">Suggested pairings</b>'
    + '<button class="cont small" id="hoverview" hidden>All pairings</button><span class="status" id="mstat"></span></div>'
    + '<div class="matchbody" id="mbody"></div></div></div>'
    + '<div class="board" id="deskboard" role="tabpanel" aria-labelledby="tab-board" hidden>'
    + '<div class="board-head"><div class="grow"><div class="secthead">Live</div><h2>Who matched with whom</h2></div>'
    + '<div class="board-stats" id="board-stats"></div><button class="cont ghost small" id="board-full">Full screen</button></div>'
    + '<div class="board-grid" id="board-grid" aria-live="polite"></div></div>';
}

function bindHostDesk(){
  el("#tab-app").onclick = function(){ showTab("app"); };
  el("#tab-hosts").onclick = function(){ showTab("hosts"); };
  el("#tab-board").onclick = function(){ showTab("board"); };
  el("#hostimporter").onchange = function(){ importHostFiles(this.files); this.value = ""; };
  el("#hostpastebtn").onclick = function(){ el("#hostpastebox").hidden = false; el("#hostpastein").focus(); };
  el("#hostpastecancel").onclick = function(){ el("#hostpastebox").hidden = true; el("#hostpastein").value = ""; };
  el("#hostpasteadd").onclick = function(){
    var text = el("#hostpastein").value.trim(); if (!text) return;
    importHostTexts([text]); el("#hostpastein").value = ""; el("#hostpastebox").hidden = true;
  };
  el("#hrefresh").onclick = function(){ loadQueue(); loadHosts(); };
  /* CSVs start with a byte-order mark so Excel reads the curly apostrophes as UTF-8. */
  el("#hosttemplate").onclick = function(){
    loadMatcher().then(function(M){
      if (!M){ setStatus("hstat", "no", MATCHER_MISSING); return; }
      offerDownload("genstay-host-template.csv", "﻿" + M.hostCsvTemplate(), "hstat");
    });
  };
  el("#hostexport").onclick = function(){
    if (!desk.hosts.length || !window.GenStayMatch){ setStatus("hstat", "wait", "No host profiles to download yet."); return; }
    offerDownload("genstay-hosts-" + nowISO().slice(0, 10) + ".csv", "﻿" + GenStayMatch.hostsToCsv(desk.hosts), "hstat");
  };
  el("#hoverview").onclick = function(){ desk.hostSel = null; drawHosts(); };
  el("#hlist").addEventListener("click", matchClick);
  el("#mbody").addEventListener("click", matchClick);
  el("#mbody").addEventListener("change", function(e){ if (e.target.id === "hst-status") setHostStatus(desk.hostSel, e.target.value); });
  var full = el("#board-full");
  full.hidden = !document.fullscreenEnabled;
  full.onclick = function(){ var b = el("#deskboard"); if (b.requestFullscreen) b.requestFullscreen().then(null, function(){}); };
}
function matchClick(e){
  var b = e.target.closest && e.target.closest("button");
  if (!b || b.disabled) return;
  if (b.hasAttribute("data-suggest")) suggestPairing(b.getAttribute("data-suggest"), b.getAttribute("data-for"), b);
  else if (b.hasAttribute("data-open")){ showTab("app"); openItem(b.getAttribute("data-open")); }
  else if (b.hasAttribute("data-host")){ desk.hostSel = b.getAttribute("data-host"); drawHosts(); el("#mbody").scrollTop = 0; }
  else if (b.id === "hremove") removeHost(b);
}
function showTab(name){
  desk.tab = name;
  ["app", "hosts", "board"].forEach(function(t){
    el("#desk" + t).hidden = t !== name;
    el("#tab-" + t).setAttribute("aria-selected", String(t === name));
  });
  clearInterval(desk.boardTick);
  if (name === "hosts") drawHosts();
  if (name === "board"){ drawBoard(); desk.boardTick = setInterval(drawBoard, 20000); }
}

/* ---------- reading, saving and removing hosts ---------- */
function loadHosts(){
  return loadMatcher().then(function(M){
    if (!desk) return;
    if (!M){ setStatus("hstat", "no", MATCHER_MISSING); drawHosts(); return; }
    if (!desk.db){
      setStatus("hstat", "wait", "The placement record isn’t available in this view. Host profiles you add are shown here but not saved.");
      refreshMatches();
      return;
    }
    if (desk.hostsLive){ desk.hostsLive(); desk.hostsLive = null; }
    var first = true;
    setStatus("hstat", "wait", "Reading host profiles…");
    /* live: another staff screen adding or changing a host shows up here too */
    desk.hostsLive = desk.db.collection("hosts").limit(1000).onSnapshot(function(snap){
      if (!desk) return;
      desk.hosts = snap.docs.map(function(d){ return d.data(); }).filter(function(h){ return h && h.meta && h.meta.hostId; });
      if (first) setStatus("hstat", "ok", "Read " + count(desk.hosts.length, "host profile") + ". Changes appear here as they’re made.");
      first = false;
      refreshMatches();
    }, function(err){
      setStatus("hstat", "no", "Lost the live link to the host profiles (" + ((err && err.code) || "unavailable") + "). Press Refresh.");
    });
  });
}
function importHostFiles(files){
  var list = Array.prototype.slice.call(files || []);
  if (!list.length) return;
  Promise.all(list.map(function(f){ return f.text().then(null, function(){ return ""; }); })).then(importHostTexts);
}
function importHostTexts(texts){
  loadMatcher().then(function(M){
    if (!M){ setStatus("hstat", "no", MATCHER_MISSING); return; }
    var found = [], notes = [];
    texts.forEach(function(t){ var r = M.parseHosts(t); found = found.concat(r.hosts); notes = notes.concat(r.problems); });
    if (!found.length){ setStatus("hstat", "no", notes[0] || "No host profiles found."); return; }
    var today = nowISO().slice(0, 10);
    found.forEach(function(h){ if (!h.meta.updatedAt) h.meta.updatedAt = today; });
    desk.hostSel = found.length === 1 ? found[0].meta.hostId : null;
    showTab("hosts");
    saveHosts(found, "hstat", "Added " + count(found.length, "host profile") + "." + (notes.length ? " Note: " + notes.slice(0, 2).join(" ") : ""));
  });
}
/* Saves hosts (a new one, or a changed one replacing the old), then rematches. */
function saveHosts(list, statusId, okText){
  var done = function(){
    list.forEach(function(h){
      desk.hosts = desk.hosts.filter(function(x){ return x.meta.hostId !== h.meta.hostId; });
      desk.hosts.push(h);
    });
    refreshMatches();
    drawHosts();
    if (desk.db) setStatus(statusId, "ok", okText);
    else setStatus(statusId, "wait", okText + " Shown here only: the placement record isn’t available in this view.");
  };
  if (!desk.db){ done(); return Promise.resolve(); }
  setStatus(statusId, "wait", "Saving…");
  return list.reduce(function(chain, h){
    return chain.then(function(){ return desk.db.doc("hosts/" + cleanId(h.meta.hostId)).set(h); });
  }, Promise.resolve()).then(done, function(err){
    setStatus(statusId, "no", "Couldn’t save (" + ((err && err.code) || "unavailable") + ").");
  });
}
function setHostStatus(id, status){
  var h = hostById(id); if (!h) return;
  var copy = JSON.parse(JSON.stringify(h));
  copy.meta.pairingStatus = status; copy.meta.updatedAt = nowISO().slice(0, 10);
  saveHosts([copy], "mstat", hostLabel(h) + ": " + GenStayMatch.hostStatus(copy).label.toLowerCase() + ".");
}
/* Two clicks, because the viewer blocks confirm(). */
function removeHost(b){
  var h = hostById(desk.hostSel); if (!h) return;
  if (!b.getAttribute("data-armed")){
    b.setAttribute("data-armed", "1"); b.textContent = "Click again to remove";
    setTimeout(function(){ if (b.isConnected){ b.removeAttribute("data-armed"); b.textContent = "Remove host"; } }, 4000);
    return;
  }
  var id = h.meta.hostId;
  var done = function(){
    desk.hosts = desk.hosts.filter(function(x){ return x.meta.hostId !== id; });
    desk.hostSel = null;
    refreshMatches(); drawHosts();
    setStatus("mstat", "ok", "Removed " + hostLabel(h) + ".");
  };
  if (!desk.db){ done(); return; }
  desk.db.doc("hosts/" + cleanId(id)).delete().then(done, function(err){
    setStatus("mstat", "no", "Couldn’t remove (" + ((err && err.code) || "unavailable") + ").");
  });
}

/* ---------- matching ---------- */
function refreshMatches(){
  if (!desk || !window.GenStayMatch) return;
  desk.match = GenStayMatch.matchAll(desk.items.map(function(it){
    return {id: it.id, name: it.name || "Unnamed applicant", profile: mergedProfile(it), suggestedHostId: (desk.reviews[it.id] || {}).suggestedHostId || ""};
  }), desk.hosts);
  if (desk.tab === "hosts") drawHosts();
  if (desk.tab === "board") drawBoard();
  var it = currentItem();
  if (it) drawBestHosts(it);
}
function hostById(id){ return desk.hosts.filter(function(h){ return h.meta.hostId === id; })[0] || null; }
function itemById(id){ return desk.items.filter(function(it){ return it.id === id; })[0] || null; }
function hostLabel(h){ return window.GenStayMatch ? GenStayMatch.hostName(h) : (h.meta && h.meta.hostId) || "Host"; }
function hostFirstOf(id){ var h = hostById(id); return h && window.GenStayMatch ? GenStayMatch.hostFirst(h) : "the host"; }
function resultFor(hostId, studentId){
  var r = desk.match && desk.match.hosts[hostId];
  return r ? r.ranked.concat(r.ruledOut).filter(function(x){ return x.studentId === studentId; })[0] || null : null;
}
/* Applicants staff have already paired with this host. */
function linkedNames(hostId){
  var r = desk.match && desk.match.hosts[hostId];
  return r ? r.ranked.concat(r.ruledOut).filter(function(x){
    var it = itemById(x.studentId);
    return x.linked && it && STAFF_PAIRED.indexOf(reviewFor(it).pairingStatus) !== -1;
  }).map(function(x){ return x.studentName; }) : [];
}
function count(n, word){ return n + " " + word + (n === 1 ? "" : "s"); }
function ordinal(n){ return n + (n % 10 === 1 && n % 100 !== 11 ? "st" : n % 10 === 2 && n % 100 !== 12 ? "nd" : n % 10 === 3 && n % 100 !== 13 ? "rd" : "th"); }
function emptyHTML(text){ return '<div class="empty-state">' + esc(text) + '</div>'; }

/* The applicant's review: shortlisted (unless already further along) for this homeowner. */
function suggestPairing(studentId, hostId, b){
  var it = itemById(studentId), h = hostById(hostId);
  if (!it || !h || !window.GenStayMatch) return;
  var cur = reviewFor(it);
  var review = {pairingStatus: ["new", "screening"].indexOf(cur.pairingStatus) !== -1 ? "shortlisted" : cur.pairingStatus,
                suggestedFor: GenStayMatch.hostFullName(h), suggestedHostId: hostId, watchPoint: cur.watchPoint, checks: cur.checks,
                reviewedAt: nowISO(), reviewedBy: desk.uid || null};
  var done = function(){
    desk.reviews[it.id] = review;
    drawQueue();
    refreshMatches();
    if (desk.current === it.id){ drawReview(it); sendToFrame(mergedProfile(it, desk.run && desk.run.profile)); }
    setStatus("mstat", desk.db ? "ok" : "wait", (it.name || "The applicant") + " is " + label(PAIRING, review.pairingStatus).toLowerCase()
      + " for " + hostLabel(h) + "." + (desk.db ? "" : " Shown here only: the placement record isn’t available in this view."));
  };
  if (b) b.disabled = true;
  if (!desk.db){ done(); return; }
  desk.db.doc("reviews/" + it.id).set(review).then(done, function(err){
    if (b) b.disabled = false;
    setStatus("mstat", "no", "Couldn’t save (" + ((err && err.code) || "unavailable") + ").");
  });
}
/* The host a typed homeowner name refers to, so a pairing made by hand counts in the matching too. */
function hostIdFor(name, it){
  var n = String(name || "").trim().toLowerCase();
  if (!n || !window.GenStayMatch) return null;
  var h = desk.hosts.filter(function(x){ return GenStayMatch.hostFullName(x).toLowerCase() === n || GenStayMatch.hostName(x).toLowerCase() === n; })[0];
  if (h) return h.meta.hostId;
  var before = desk.reviews[it.id] || {};
  return before.suggestedFor && before.suggestedFor.trim().toLowerCase() === n ? before.suggestedHostId || null : null;
}

/* ---------- drawing the Hosts and matches tab ---------- */
function drawHosts(){
  if (!desk || !el("#hlist")) return;
  var M = window.GenStayMatch, mt = desk.match;
  if (desk.hostSel && !hostById(desk.hostSel)) desk.hostSel = null;
  var hosts = desk.hosts.slice().sort(function(a, b){ return hostLabel(a).localeCompare(hostLabel(b)); });
  el("#hlist").innerHTML = hosts.length ? hosts.map(function(h){
    var id = h.meta.hostId, r = mt && mt.hosts[id], best = r && r.ranked[0], linked = linkedNames(id), st = M ? M.hostStatus(h) : {label: "", available: true};
    return '<li><button class="qitem" data-host="' + esc(id) + '" aria-current="' + (desk.hostSel === id) + '">'
      + '<span class="nm">' + esc(hostLabel(h)) + '</span>'
      + '<span class="when">' + esc([(h.host || {}).age, (h.home || {}).suburb].filter(Boolean).join(" · ")) + '</span>'
      + '<span class="meta"><span class="pill">' + esc(st.label) + '</span>'
      + (linked.length ? '<span class="pill dark" style="background:var(--slate)">' + esc(linked.length > 1 ? linked.length + " paired by staff" : "Paired: " + linked[0]) + '</span>' : '')
      + (best && !best.linked && st.available ? '<span class="pill dark" style="background:' + BAND[best.band][1] + '">Best: ' + esc(best.studentName) + ' · ' + best.score + '</span>'
          : r && st.available && !linked.length ? '<span class="pill">No suitable applicant yet</span>' : '')
      + '</span></button></li>';
  }).join("") : '<li class="empty-state">No host profiles yet.</li>';
  var h = desk.hostSel && hostById(desk.hostSel);
  el("#hname").textContent = h ? hostLabel(h) : "Suggested pairings";
  el("#hoverview").hidden = !h;
  el("#mbody").innerHTML = !M ? emptyHTML(MATCHER_MISSING) : h ? hostDetailHTML(h) : overviewHTML();
}

function overviewHTML(){
  var mt = desk.match;
  if (!desk.hosts.length) return emptyHTML("No host profiles yet. Add the hosts file (JSON), or download the host template, fill in one row per homeowner "
    + "in Excel or Google Sheets, and add the saved CSV, or copy the rows (heading row first) and use Paste hosts. Suggested pairings appear here as soon as hosts are added.");
  if (!mt) return emptyHTML("Working out the pairings…");
  var ids = Object.keys(mt.students);
  if (!ids.length) return emptyHTML("No applicants to match yet. Pairings appear here as applicants finish, or when you add their profile files on the Applicants tab.");
  var pool = ids.filter(function(id){ return !mt.students[id].excluded.length; }).length;
  var looking = desk.hosts.filter(function(h){ return GenStayMatch.hostStatus(h).available; }).length;
  var html = '<p class="sub">' + count(desk.hosts.length, "host") + ' (' + looking + ' available) · ' + pool + ' of ' + count(ids.length, "applicant")
    + ' in the matching pool · ' + count(mt.pairings.length, "pairing") + ' suggested.</p>'
    + '<p class="sub" style="font-size:12.5px">Each pairing is scored from both sides: how well the applicant meets the host’s needs, and how well the home suits the applicant. '
    + 'The suggestions use one applicant per room and make the most suitable pairings overall, so someone may be suggested for their second-best host when their best suits another applicant much better. '
    + 'Only pairings scoring ' + mt.minScore + ' or more are suggested: an applicant whose best is lower waits on the shortlist for a suitable host. '
    + 'Pairings staff have made are kept. Suggesting a pairing shortlists the applicant for that homeowner in their review. Nobody is contacted.</p>'
    + '<div class="secthead">Suggested pairings</div>'
    + (mt.pairings.length ? mt.pairings.map(function(p){ var r = resultFor(p.hostId, p.studentId); return r ? matchCardHTML(r, true, p) : ""; }).join("")
        : emptyHTML("No pairing passes every filter yet. Open a host to see who was ruled out, and why."));
  if (mt.alsoPaired.length) html += '<div class="secthead">Also paired by staff</div><ul class="why">' + mt.alsoPaired.map(function(a){
    return '<li class="' + (a.eligible ? "ok" : "no") + '"><button class="linkbtn" data-open="' + esc(a.studentId) + '">' + esc(a.studentName) + '</button> with '
      + esc(a.hostName + " (" + label(PAIRING, a.status).toLowerCase() + ")") + (a.eligible ? ", scoring " + a.score
        : ", but: " + esc(a.blockers.map(function(b){ return b.text; }).join("; "))) + '.</li>';
  }).join("") + '</ul>';
  if (mt.unmatchedHosts.length) html += '<div class="secthead">Hosts still waiting</div><ul class="why">' + mt.unmatchedHosts.map(function(u){
    return '<li class="warn"><button class="linkbtn" data-host="' + esc(u.id) + '">' + esc(u.name) + '</button>: '
      + esc(u.eligible ? count(u.eligible, "suitable applicant") + ", each placed with a host that suits them better overall"
        : "no suitable applicant yet" + (u.reasons.length ? "; most were ruled out by " + u.reasons.join(", ") : "")) + '.</li>';
  }).join("") + '</ul>';
  if (mt.unmatchedStudents.length) html += '<div class="secthead">Shortlisted: waiting for a suitable host</div><p class="sub">'
    + esc(mt.unmatchedStudents.map(function(u){
        return u.name + (u.strongEnough ? " (" + count(u.strongEnough, "strong enough host") + ", each placed with someone who suits them better overall)"
          : u.eligible ? " (best so far " + u.best + ")" : " (no host passes every check yet)");
      }).join(", ")) + '.</p>';
  return html;
}

function partsHTML(parts){
  return parts.map(function(p){
    return '<span class="mpart" title="' + esc(p.label + (p.note ? ": " + p.note : "")) + '">' + esc(p.label) + ' ' + Math.round(p.points) + '/' + p.weight
      + '<i><b style="width:' + Math.round(p.value * 100) + '%"></b></i></span>';
  }).join("");
}
/* One pairing: the overall score, each side's fit, the reasons, the actions. p (optional) is the allocation entry. */
function matchCardHTML(r, pairMode, p){
  var it = itemById(r.studentId), type = it && PROFILE_TYPES[it.screeningProfile], status = it ? reviewFor(it).pairingStatus : "new";
  var paired = r.linked && STAFF_PAIRED.indexOf(status) !== -1, who = String(r.studentName).split(" ")[0], host = hostFirstOf(r.hostId);
  return '<div class="mcard"><div class="mhead">'
    + '<span class="score" style="background:' + (r.eligible ? BAND[r.band][1] : "var(--bad)") + '" title="' + esc(r.eligible ? BAND[r.band][0] : "Ruled out") + '">' + r.score + '</span>'
    + (pairMode ? '<b>' + esc(r.hostName) + '</b><span class="amp">and</span>' : '') + '<b>' + esc(r.studentName) + '</b>'
    + (type ? '<span class="pill dark" style="background:' + type.colour + '">' + esc(type.title.replace(/^The /, "")) + '</span>' : '')
    + (paired ? '<span class="pill dark" style="background:var(--slate)">' + esc(label(PAIRING, status)) + ' by staff</span>' : '')
    + (p && !p.locked && p.studentRank > 1 ? '<span class="pill">' + esc(who + "’s " + ordinal(p.studentRank) + " choice") + '</span>' : '')
    + (r.eligible && desk.match && r.score < desk.match.minScore ? '<span class="pill">Under ' + desk.match.minScore + ': not suggested automatically</span>' : '')
    + '</div>'
    + '<div class="sides"><span>For ' + esc(host) + ' <b>' + r.hostFit + '</b></span><span>For ' + esc(who) + ' <b>' + r.studentFit + '</b></span></div>'
    + whyHTML(r)
    + '<details class="parts"><summary>Score breakdown</summary><div class="secthead">How well ' + esc(who) + ' meets ' + esc(host) + '’s needs</div><div class="mparts">' + partsHTML(r.parts.host) + '</div>'
    + '<div class="secthead">How well the home suits ' + esc(who) + '</div><div class="mparts">' + partsHTML(r.parts.student) + '</div></details>'
    + '<div class="btnrow">'
    + (paired ? '' : '<button class="cont primary small" data-suggest="' + esc(r.studentId) + '" data-for="' + esc(r.hostId) + '"' + (r.eligible ? '' : ' disabled') + '>Suggest this pairing</button>')
    + '<button class="cont ghost small" data-open="' + esc(r.studentId) + '">Open applicant</button>'
    + (pairMode ? '<button class="cont ghost small" data-host="' + esc(r.hostId) + '">View host</button>' : '')
    + '</div></div>';
}
function whyHTML(r){
  var li = function(cls){ return function(t){ return '<li class="' + cls + '">' + esc(t) + '</li>'; }; };
  var first = r.blockers.map(function(b){ return b.text; }).map(li("no")).concat(r.strengths.slice(0, 4).map(li("ok")), r.cautions.slice(0, 3).map(li("warn")));
  var rest = r.strengths.slice(4).map(li("ok")).concat(r.cautions.slice(3).map(li("warn")));
  return (first.length ? '<ul class="why">' + first.join("") + '</ul>' : '')
    + (rest.length ? '<details><summary>' + rest.length + ' more</summary><ul class="why">' + rest.join("") + '</ul></details>' : '');
}

function hostDetailHTML(h){
  var M = GenStayMatch, r = desk.match && desk.match.hosts[h.meta.hostId], x = h.host || {}, ranked = r ? r.ranked : [];
  var code = M.hostStatus(h).code, codes = Object.keys(M.HOST_STATUS);
  if (codes.indexOf(code) === -1) codes.push(code);
  var html = '<div class="mcard"><div class="mhead"><b>' + esc(M.hostFullName(h)) + '</b>'
    + (x.age ? '<span class="pill">' + esc(x.age) + '</span>' : '') + ((h.home || {}).suburb ? '<span class="pill">' + esc(h.home.suburb) + '</span>' : '')
    + ((h.meta || {}).hostFit ? '<span class="pill">' + esc(h.meta.hostFit) + ' fit</span>' : '')
    + '<span class="grow"></span><label>Status <select id="hst-status">' + codes.map(function(k){
        return '<option value="' + esc(k) + '"' + (code === k ? " selected" : "") + '>' + esc(M.HOST_STATUS[k] || k.replace(/_/g, " ")) + '</option>';
      }).join("") + '</select></label>'
    + '<button class="cont ghost small" id="hremove">Remove host</button></div>'
    + '<div class="hfacts">' + M.hostFacts(h).map(function(f){ return '<div><span>' + esc(f[0]) + '</span>' + esc(f[1]) + '</div>'; }).join("") + '</div></div>'
    + '<div class="secthead">Best applicants for ' + esc(hostLabel(h)) + (ranked.length > 10 ? ' (top 10 of ' + ranked.length + ')' : '') + '</div>'
    + (ranked.length ? ranked.slice(0, 10).map(function(m){ return matchCardHTML(m, false); }).join("")
        : emptyHTML(desk.items.length ? "No applicant passes this homeowner’s filters yet." : "No applicants to match yet."));
  if (r && r.ruledOut.length) html += '<details class="out"><summary>Ruled out (' + r.ruledOut.length + ')</summary><ul class="why">'
    + r.ruledOut.map(function(o){ return '<li class="no"><b>' + esc(o.studentName) + ':</b> ' + esc(o.blockers.map(function(b){ return b.text; }).join("; ")) + '</li>'; }).join("")
    + '</ul></details>';
  return html;
}

/* The applicant review panel's shortlist of homeowners. */
function drawBestHosts(it){
  var box = el("#rv-best");
  if (!box) return;
  var s = window.GenStayMatch && desk.match && desk.match.students[it.id];
  var head = '<div class="secthead">Best homeowners</div>';
  if (!desk.hosts.length){ box.innerHTML = head + '<p class="sub" style="font-size:12.5px">Add host profiles on the Hosts and matches tab to see the best homeowners here.</p>'; return; }
  if (!s){ box.innerHTML = ""; return; }
  if (s.excluded.length){ box.innerHTML = head + '<p class="sub" style="font-size:12.5px">Not matched automatically: ' + esc(s.excluded.join("; ")) + '.</p>'; return; }
  if (!s.ranked.length){
    var near = s.ruledOut[0];
    box.innerHTML = head + '<p class="sub" style="font-size:12.5px">No suitable homeowner yet.'
      + (near ? ' Closest: ' + esc(near.hostName) + ' (' + esc(near.blockers.map(function(b){ return b.text; }).join("; ")) + ').' : '') + '</p>';
    return;
  }
  box.innerHTML = head + (s.ranked[0].score < desk.match.minScore ? '<p class="sub" style="font-size:12.5px">None reaches ' + desk.match.minScore + ' yet, so the applicant waits on the shortlist for a suitable host.</p>' : '')
    + s.ranked.slice(0, 3).map(function(r){
    var h = hostById(r.hostId);
    return '<div class="hrow"><span class="score" style="background:' + BAND[r.band][1] + '" title="' + esc(BAND[r.band][0]) + '">' + r.score + '</span>'
      + '<span class="grow"><b>' + esc(r.hostName) + '</b><small>' + esc([h && (h.home || {}).suburb, BAND[r.band][0]].filter(Boolean).join(" · ")) + '</small></span>'
      + '<button class="cont ghost small" data-use="' + esc(r.hostId) + '">Use</button></div>';
  }).join("");
  Array.prototype.forEach.call(box.querySelectorAll("[data-use]"), function(b){
    b.onclick = function(){
      var h = hostById(b.getAttribute("data-use")); if (!h) return;
      el("#rv-for").value = GenStayMatch.hostFullName(h);
      if (["new", "screening"].indexOf(el("#rv-status").value) !== -1) el("#rv-status").value = "shortlisted";
      setStatus("rvstat", "wait", "Press Save review to keep this.");
    };
  });
}

/* ---------- the live board ---------- */
/* A participant's outcome, as the results screen and this board show it: matched
   with a host, shortlisted and waiting for a suitable host, or not placed. */
function matchSummary(best){
  if (!best) return null;
  var M = GenStayMatch, out = {status: best.status, minScore: best.minScore, at: nowISO()};
  if (best.status === "screened_out"){
    out.reasons = [].concat.apply([], best.screenedOut.map(function(b){ return b.points; }));
    return out;
  }
  var h = best.host, x = h.host || {}, r = best.result;
  return Object.assign(out, {hostId: M.hostId(h), hostName: M.hostName(h), first: M.hostFirst(h), age: x.age || null,
          partnerAge: x.householdType === "couple" && x.partner ? x.partner.age || null : null,
          suburb: (h.home || {}).suburb || "", career: String(x.formerCareer || "").split(",")[0],
          score: r.score, hostFit: r.hostFit, studentFit: r.studentFit, band: r.band,
          highlights: r.forStudent, talkAbout: r.talkAbout, closest: best.closest, standsInWay: best.standsInWay,
          shortfall: best.shortfall, setAside: best.setAside});
}
/* The outcome of a summary, including ones saved before outcomes had names. */
function outcomeOf(m){ return !m ? null : m.status || (m.heldBack ? "screened_out" : m.closest ? "waiting" : "matched"); }
function outcomeLabel(m){
  var o = outcomeOf(m);
  return o === "matched" ? "Demo match: " + m.first + " · " + m.score : o === "waiting" ? "Shortlisted: waiting for a host" : o === "screened_out" ? "Not placed: screening" : "";
}
/* The outcome the participant saw, or (for applicants who never saw one) their outcome against the hosts here. */
function boardMatch(it){
  if (it.demoMatch) return it.demoMatch;
  if (!window.GenStayMatch || !desk.hosts.length) return null;
  desk.boardCache = desk.boardCache || {};
  var key = it.id + "@" + it.updatedAt + "@" + desk.hosts.length, c = desk.boardCache[key];
  if (c === undefined) c = desk.boardCache[key] = matchSummary(GenStayMatch.bestMatch({id: it.id, name: it.name, profile: mergedProfile(it)}, desk.hosts));
  return c;
}
function ago(iso){
  var s = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 1000));
  return !isFinite(s) ? "" : s < 60 ? "just now" : s < 3600 ? Math.floor(s / 60) + " min ago" : s < 86400 ? Math.floor(s / 3600) + " h ago" : String(iso).slice(0, 10);
}
function drawBoard(){
  if (!desk || !el("#board-grid")) return;
  var done = desk.items.filter(function(it){ return it.complete; });
  var rows = done.map(function(it){ return {it: it, m: boardMatch(it)}; });
  var tally = {}, n = {matched: 0, waiting: 0, screened_out: 0};
  rows.forEach(function(r){ var o = outcomeOf(r.m); if (o) n[o]++; if (o === "matched") tally[r.m.first] = (tally[r.m.first] || 0) + 1; });
  var top = Object.keys(tally).sort(function(a, b){ return tally[b] - tally[a]; }).slice(0, 3);
  el("#board-stats").innerHTML = '<span><b>' + done.length + '</b> played</span><span><b>' + n.matched + '</b> placed</span>'
    + '<span><b>' + n.waiting + '</b> on the shortlist</span><span><b>' + n.screened_out + '</b> not placed</span>'
    + (top.length ? '<span>Most matched: ' + esc(top.map(function(k){ return k + " (" + tally[k] + ")"; }).join(", ")) + '</span>' : '');
  /* a new arrival animates in once, and stays highlighted for 20 seconds */
  var seen = desk.boardSeen, firstDraw = !seen, now = Date.now();
  desk.boardSeen = seen = seen || {};
  el("#board-grid").innerHTML = rows.length ? rows.slice(0, 60).map(function(r){
    var it = r.it, m = r.m, o = outcomeOf(m), arrive = !firstDraw && !seen[it.id];
    if (!seen[it.id]) seen[it.id] = firstDraw ? 1 : now;
    var fresh = seen[it.id] > 1 && now - seen[it.id] < 20000;
    var initials = o === "matched" ? m.hostName.split(/\s+/).filter(function(w){ return w !== "and"; }) : [];
    initials = initials.length ? initials[0].charAt(0) + (initials.length > 1 ? initials[initials.length - 1].charAt(0) : "") : "";
    return '<article class="bcard' + (o === "waiting" ? " waiting" : o === "screened_out" ? " out" : "") + (fresh ? " fresh" : "") + (arrive ? " arrive" : "") + '">'
      + '<div class="b-top"><span class="b-person">' + esc(String(it.name || "Someone").split(" ")[0]) + '</span><span class="b-when">' + esc(ago(it.updatedAt)) + '</span></div>'
      + (o === "matched" ? '<div class="b-arrow">matched with</div>'
          + '<div class="b-host"><span class="b-avatar" aria-hidden="true">' + esc(initials) + '</span><span class="b-name">' + esc(m.first) + (m.age ? ", " + m.age + (m.partnerAge ? " and " + m.partnerAge : "") : "") + '</span>'
          + '<span class="b-score">' + m.score + '</span></div>'
          + '<div class="b-sub">' + esc([m.suburb, m.career].filter(Boolean).join(" · ")) + '</div>'
          + (m.highlights && m.highlights.length ? '<ul class="b-why">' + m.highlights.slice(0, 2).map(function(t){ return '<li>' + esc(t) + '</li>'; }).join("") + '</ul>' : '')
        : o === "waiting" ? '<div class="b-arrow">shortlisted</div><div class="b-state">Waiting for a suitable host</div>'
          + '<div class="b-sub">' + (m.closest ? "No current host passes every check yet" : "Best so far " + m.score + "; we place at " + (m.minScore || 65) + " or more") + '</div>'
        : o === "screened_out" ? '<div class="b-arrow">not placed this time</div><div class="b-sub">Safety and screening come first</div>'
        : '<div class="b-arrow">' + (desk.hosts.length ? "no match yet" : "add hosts to see matches") + '</div>')
      + '</article>';
  }).join("") : '<div class="empty-state">Matches appear here, newest first, as people finish.</div>';
}
</script>
<script>
"use strict";
/* ============================================================
   BOOT
   ============================================================ */
function hashIsStaff(){ return /^#(staff|assessor)$/i.test(location.hash || ""); }
function boot(){
  S = freshState();
  if (hashIsStaff()) S.view = "staff";
  render();
}
/* The hash can be typed into a tab that already has the game open. A run in
   progress is already saved, and the title screen offers to resume it. */
window.addEventListener("hashchange", function(){
  clearTimer();
  if (hashIsStaff()){
    if (S && S.view === "staff") return;
    if (S && S.pid && !S.submittedAt) save();
    S = freshState(); S.view = "staff"; render();
  } else if (S && S.view === "staff"){
    stopLive(); desk = null; S = freshState(); render();
  }
});
boot();
</script>
