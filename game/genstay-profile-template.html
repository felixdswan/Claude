<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GenStay Matchmaking Profile</title>
<!--
  GenStay Matchmaking Profile — receiving template v1.0.0
  ---------------------------------------------------------------
  Blank by default. Send it a profile object (shape: GenStayProfile.blank())
  through any of these routes and it fills itself in:

    1. JS API (same page)    GenStayProfile.load(data) / .update(partial) / .clear()
    2. Inline global         <script>window.GENSTAY_PROFILE = {...}</script> placed before this file's script
    3. postMessage           win.postMessage({ type: 'genstay:profile', mode: 'update', data }, origin)
                             (template posts {type:'genstay:ready'} to its opener/parent when it can receive)
    4. Link                  template.html#data=<base64url JSON>      (GenStayProfile.encode(data))
    5. JSON file / endpoint  template.html?src=/path/to/profile.json
    6. Browser storage       localStorage['genstay:profile'] = JSON.stringify(data)   (same origin, live across tabs)

  URL options: ?view=family (hides staff-only rows)  ?keys (shows data paths)  ?demo (loads sample data)  ?embed (hides PDF, Print and Export)
  Settings: set window.GENSTAY_CONFIG = {...} before this script (see CONFIG below).
  PDF: the Download PDF button, GenStayProfile.pdf(), or postMessage {type:'genstay:pdf', id, profiles?, view?}
       (replies genstay:pdf:progress and genstay:pdf:done with the PDF bytes). Needs cdnjs; offline, use Print.
  Full field list: genstay-profile-fields.md
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Fraunces:opsz,wght,SOFT@9..144,300..700,0..100&display=swap" rel="stylesheet">
<style>
:root{
  --green:#0a5d45; --green-mid:#6fa98c; --green-pale:#dce9e2;
  --lime:#cbf796; --peri:#a1b5e8; --peri-pale:#e9eefb;
  --ink:#333; --ink-2:#555; --muted:#8a8a8a; --empty:#c2c2c2; --line:#e4e4e4;
  --bg:#eceef1; --page:#fff;
  --serif:'Fraunces','Cooper BT',Georgia,'Times New Roman',serif;
  --sans:'Figtree','Eastman Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
.serif{font-family:var(--serif);font-variation-settings:"SOFT" 100}

/* toolbar (screen only) */
.toolbar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;
  padding:10px 16px;background:rgba(236,238,241,.92);backdrop-filter:blur(6px);border-bottom:1px solid #dcdfe4;font-size:13px}
.status{display:flex;align-items:center;gap:8px;color:var(--ink-2);min-width:0}
.status .dot{width:8px;height:8px;border-radius:50%;background:#b9bec6;flex:none}
.status[data-state="filled"] .dot{background:var(--green)}
.status b{color:var(--ink)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tools button{font:600 13px var(--sans);color:var(--ink);background:#fff;border:1px solid #d3d7dd;border-radius:6px;padding:5px 10px;cursor:pointer}
.tools button:hover{border-color:#9aa3ae}
.tools button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.seg{display:inline-flex}.seg button{border-radius:0}.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0;margin-left:-1px}

/* page */
.page{max-width:820px;margin:24px auto 64px;background:var(--page);padding:40px 44px 56px;box-shadow:0 1px 3px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.04)}
.masthead{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center}
.title-block{background:var(--green);color:#fff;border-radius:8px;padding:26px 34px 28px}
.title-block .brand{display:block;font:700 40px/1 var(--serif);font-variation-settings:"SOFT" 100,"opsz" 144;letter-spacing:-.01em}
.title-block .doc{display:block;font:300 36px/1.15 var(--serif);font-variation-settings:"SOFT" 100,"opsz" 144;margin-top:2px}
.logo{display:flex;flex-direction:column;align-items:center;gap:8px;padding-right:6px}
.logo .mark{width:68px;height:auto}.logo .word{width:116px;height:auto}
.band{margin-top:30px;background:var(--peri);border-radius:4px;padding:5px 14px;display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink)}
.band b{font-weight:700}
.band .pill{display:inline-block;background:rgba(255,255,255,.4);border-radius:999px;padding:1px 10px;font-weight:700}

.identity{display:grid;grid-template-columns:132px 1fr;gap:30px;align-items:center;padding:24px 22px 4px}
.photo{width:120px;height:150px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--green-pale);color:var(--green);
  font:400 40px/1 var(--serif);font-variation-settings:"SOFT" 100}
.photo img{width:100%;height:100%;object-fit:cover}
.photo.is-blank{background:#f1f2f3;color:#c9cdd2}
.identity h1{margin:0;font:300 27px/1.2 var(--serif);font-variation-settings:"SOFT" 100;color:var(--green)}
.identity .sub{margin:4px 0 0;color:var(--ink-2)}
.stages{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.stage{display:inline-flex;align-items:center;gap:5px;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 10px 2px 7px;color:var(--muted)}
.stage .ic{width:14px;height:14px;border-radius:50%;border:1.5px solid currentColor;display:inline-grid;place-items:center;font-size:9px;line-height:1}
.stage.done{color:var(--green);border-color:#bcd8c9;background:#f2f8f4}
.stage.done .ic{background:var(--green);border-color:var(--green);color:#fff}

/* sections */
section{margin-top:38px}
section h2{margin:0;font:300 24px/1.15 var(--serif);font-variation-settings:"SOFT" 100;color:var(--green);break-after:avoid}
.caption{margin:6px 0 0;font-size:13px;color:#6b6b6b}
.rule{border:0;border-top:1px solid var(--peri);margin:10px 0 12px}
table{width:100%;border-collapse:separate;border-spacing:0 2px;table-layout:fixed}
th,td{text-align:left;vertical-align:top;padding:10px 12px;font-size:14px}
th.label{background:var(--lime);color:var(--green);font-weight:700;width:34%}
th.rowhead{background:var(--green);color:#fff;font-weight:700;width:26%}
td.corner{background:transparent}
td.value{color:var(--ink)}
tr{break-inside:avoid}
.matrix td.corner{width:26%}
.matrix th.label{width:auto}
.split th.label{width:50%}
.keys{display:none;margin-top:3px;font:400 10.5px/1.35 var(--mono);color:#5d7d6c;word-break:break-word}
th.rowhead .keys{color:#cfe6da}
body.show-keys .keys{display:block}
.empty{color:var(--empty)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-block;background:#f4f6f2;border:1px solid #e1e7da;border-radius:999px;padding:1px 10px;font-size:13px;line-height:1.6}
.chip.no{background:#f6f6f6;border-color:#e6e6e6;color:#666}
.check{display:inline-flex;align-items:center;gap:5px;margin:0 10px 2px 0;white-space:nowrap}
.check .ic{font-weight:700;width:1em;text-align:center}
.check.cleared .ic{color:var(--green)}
.check.pending .ic,.check.booked .ic{color:#4b65a8}
.check.not_started .ic{color:#999}
.status-pill{display:inline-block;border-radius:999px;padding:1px 10px;background:var(--peri-pale);color:#2f467f;font-weight:600;font-size:13px}
.dots{display:inline-flex;gap:4px;vertical-align:-2px;margin-right:8px}
.dots i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--green);display:inline-block}
.dots i.on{background:var(--green)}

/* screening */
.staff-tag{display:inline-block;margin-left:10px;vertical-align:4px;font:700 10px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:#7a4b00;background:#fdf1d8;border:1px solid #f0d9a6;border-radius:4px;padding:4px 6px}
.outcome{border-left:4px solid var(--green);background:#f6faf7;padding:12px 16px;margin:2px 0 14px}
.outcome .name{font:400 20px/1.2 var(--serif);font-variation-settings:"SOFT" 100;color:var(--green)}
.outcome p{margin:4px 0 0;color:var(--ink-2);font-size:14px}
.outcome.is-blank{border-left-color:#d6d9dd;background:#fafafa}
.outcome.is-blank .name{color:var(--empty)}
.sub-h{margin:16px 0 6px;font:700 12px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.meters{display:grid;gap:7px}
.meter{display:grid;grid-template-columns:110px 1fr 104px;gap:12px;align-items:center;font-size:14px}
.meter .bar{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;height:14px}
.meter .bar i{background:#e9ecea;border-radius:2px}
.meter .bar i:first-child{border-radius:4px 2px 2px 4px}
.meter .bar i.on{background:var(--green)}
.meter .val{color:var(--ink-2);font-size:13px}
.path{display:grid;grid-template-columns:repeat(14,1fr);gap:2px}
.path .cell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;height:44px;border-radius:3px;background:#f3f4f5;color:#b0b4b9;font-size:11px;line-height:1.15}
.path .cell b{font-size:12px}
.path .cell.t-warm{background:var(--green);color:#fff}
.path .cell.t-steady{background:var(--green-mid);color:#fff}
.path .cell.t-distant{background:var(--green-pale);color:#2c4a3c}
.path .cell.lm::before{content:"";position:absolute;top:-7px;width:7px;height:7px;background:#4b65a8;transform:rotate(45deg);border-radius:1px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:2px;display:inline-block}
.legend i.lm{width:8px;height:8px;background:#4b65a8;transform:rotate(45deg);border-radius:1px;margin:0 2px}
blockquote.final{margin:14px 0 0;padding:14px 18px;border-left:4px solid var(--peri);background:var(--peri-pale);font:400 18px/1.4 var(--serif);font-variation-settings:"SOFT" 100;color:#26365e}
blockquote.final small{display:block;margin-top:6px;font:400 12px var(--sans);color:#5b6b92}
blockquote.final.is-blank{color:var(--empty)}
.answer q{quotes:"\201C" "\201D"}
.answer .q{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}

body[data-view="family"] [data-staff]{display:none!important}

@media (max-width:640px){
  .page{margin:0;padding:24px 16px 40px;box-shadow:none}
  .masthead{grid-template-columns:1fr;gap:16px}
  .logo{flex-direction:row;justify-content:flex-start;padding:0}
  .logo .mark{width:42px}.logo .word{width:96px}
  .title-block{padding:20px 22px}.title-block .brand{font-size:32px}.title-block .doc{font-size:28px}
  .identity{grid-template-columns:88px 1fr;gap:18px;padding:20px 0 0}
  .photo{width:84px;height:104px;font-size:28px}
  th,td{padding:9px 9px;font-size:13.5px}
  th.label{width:38%} th.rowhead{width:30%}
  .meter{grid-template-columns:86px 1fr;gap:4px 10px}.meter .val{grid-column:2}
  .path .cell{height:38px;font-size:10px}.path .cell b{font-size:11px}
}
/* PDF capture: the page alone, without the toolbar or the screen margins */
body.pdf{background:#fff}
body.pdf .toolbar{display:none}
body.pdf .page{margin:0 auto;padding:28px 32px 20px;box-shadow:none;max-width:820px}
body.pdf *{font-variation-settings:normal!important} /* the canvas can't draw variable-font axes; lay out with the widths it will draw */
@media print{
  @page{size:A4;margin:12mm}
  html,body{background:#fff}
  .toolbar{display:none}
  .page{max-width:none;margin:0;padding:0;box-shadow:none}
  section{margin-top:26px}
}
</style>
</head>
<body data-view="staff">

<div class="toolbar" role="region" aria-label="Template controls">

</div>

  /* ---------- base64url (UTF-8 safe) for #data= links ---------- */

  /* ---------- PDF ----------
     Each page is a picture of the rendered profile, so the PDF looks exactly
     like the page. Pages break between rows, never through one. The two
     libraries load from cdnjs the first time a PDF is made. */
  var PDF_LIBS = ['https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
                  'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'];
  var libsReady = null;
  function loadLibs() {
    if (window.html2canvas && window.jspdf) return Promise.resolve();
    libsReady = libsReady || Promise.all(PDF_LIBS.map(function (src) {
      return new Promise(function (ok, fail) {
        var tag = document.createElement('script');
        tag.src = src; tag.onload = ok;
        tag.onerror = function () { tag.remove(); fail(new Error('The PDF tools couldn’t load. Check the internet connection, or use Print and choose Save as PDF.')); };
        document.head.appendChild(tag);

  /* Offsets (CSS px from the top of the page) where a new PDF page may start. */
  function breakPoints(root) {
    var top = root.getBoundingClientRect().top, pts = [];
    Array.prototype.forEach.call(root.querySelectorAll('section, tr, .meter, .sub-h, .outcome, .path, .legend, blockquote, .identity, .band'), function (el) {
      if ((el.tagName === 'TR' || el.classList.contains('meter')) && !el.previousElementSibling) return; // keep a heading with its first row
      pts.push(el.getBoundingClientRect().top - top);

  /* Renders the current profile and cuts it into A4 pages (10 mm margins). */

    return fonts.then(function () {
      var width = root.offsetWidth, height = root.offsetHeight, pts = breakPoints(root);
      var pageH = width * 277 / 190, cuts = [], y = 0;
      while (y < height - 2) {

            function (e) { document.body.classList.remove('pdf'); throw e; });

  function makePdf(opts) {

    var total = list ? list.length : 1;

      var first = true, i = 0;

    var btn = this, s = state.student, name = join([s.firstName, s.lastName], '-') || 'blank';
    btn.disabled = true; btn.textContent = 'Making PDF…';
    makePdf().then(function (buf) {
      var a = h('a', { href: URL.createObjectURL(new Blob([buf], { type: 'application/pdf' })),
                       download: 'genstay-profile-' + name.toLowerCase().replace(/[^a-z0-9-]+/g, '-') + '.pdf' });
      document.body.appendChild(a); a.click(); a.remove();
      btn.textContent = 'Download PDF';
    }, function (err) {
      console.warn('[GenStay] PDF:', err.message);
      btn.textContent = 'PDF unavailable offline: use Print';
    }).then(function () { btn.disabled = false; });
  });
  document.getElementById('btn-json').addEventListener('click', function () {
    var s = state.student, name = join([s.firstName, s.lastName], '-') || 'blank';
    var a = h('a', { href: URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' })),
                     download: 'genstay-profile-' + name.toLowerCase().replace(/[^a-z0-9-]+/g, '-') + '.json' });
    document.body.appendChild(a); a.click(); a.remove();
  });

  /* ---------- public API ---------- */
  window.GenStayProfile = {
    version: VERSION,
    load: function (d) { return load(d, 'api'); },        // replace everything
    update: function (d) { return update(d, 'api'); },    // merge a partial object (e.g. one questionnaire or the game result)
    clear: clear,
    get: function () { return clone(state); },
    blank: function () { return clone(CONTRACT); },        // the empty data shape, ready to fill
    status: status,
    encode: encode,                                         // base64url for #data= links
    link: function (d, base) { return (base || location.href.split('#')[0]) + '#data=' + encode(d); },
    setView: setView,
    showKeys: showKeys,
    onChange: function (fn) { listeners.push(fn); return function () { listeners = listeners.filter(function (x) { return x !== fn; }); }; },
    pdf: makePdf,                                           // resolves with the PDF bytes (ArrayBuffer)
    config: CONFIG
  };

  /* ---------- boot ---------- */
  var params = new URLSearchParams(location.search);
  setView(params.get('view') || CONFIG.defaultView);
  if (params.has('keys')) showKeys(true);
  if (CONFIG.embedded || params.has('embed')) ['btn-pdf', 'btn-print', 'btn-json'].forEach(function (id) { document.getElementById(id).hidden = true; });
  render();
  var got = false;
  if (isObj(window.GENSTAY_PROFILE)) { load(window.GENSTAY_PROFILE, 'inline'); got = true; }
  if (readHash()) got = true;
  if (params.get('src')) { readSrc(params.get('src')); got = true; }
  if (!got && CONFIG.readStorage) got = readStorage();
  if (!got && params.has('demo') && SAMPLE) load(SAMPLE, 'demo');

  var parent = window.opener || (window.parent !== window ? window.parent : null);
  if (parent) { try { parent.postMessage({ type: 'genstay:ready', version: VERSION }, '*'); } catch (e) {} }
})();
</script>
